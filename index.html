<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SquadForge</title>
  <style>
    :root {
      --bg: #0b1320;
      --card-bg: #131e30;
      --accent: #22d3ee;
      --text: #f3f4f6;
      --subtext: #9ca3af;
      --pitch-bg: #14532d;
      --pitch-line: rgba(255, 255, 255, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 12px 16px;
      border-radius: 8px;
    }

    .info-header {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .info-header input {
      flex: 1;
      min-width: 120px;
      padding: 8px;
      background: #0b1320;
      border: 1px solid #374151;
      color: white;
      border-radius: 4px;
    }

    .pitch-container {
      background: var(--pitch-bg);
      border-radius: 12px;
      padding: 10px;
      position: relative;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      aspect-ratio: 2/3;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 2px solid var(--pitch-line);
      overflow: hidden;
    }

    .pitch-line {
      position: absolute;
      border: 1px solid var(--pitch-line);
      pointer-events: none;
    }

    .center-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .center-line {
      width: 100%;
      top: 50%;
      left: 0;
    }

    .box-top {
      width: 50%;
      height: 15%;
      top: 0;
      left: 25%;
    }

    .box-bottom {
      width: 50%;
      height: 15%;
      bottom: 0;
      left: 25%;
    }

    .grid-row {
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 2;
      width: 100%;
    }

    .player-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 11px;
      cursor: pointer;
    }

    .player-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #1e293b;
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .cards-section {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
    }

    .cards-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .cards-controls input {
      padding: 8px;
      background: #0b1320;
      border: 1px solid #374151;
      color: white;
      border-radius: 4px;
    }

    button {
      background: var(--accent);
      border: none;
      color: #000;
      padding: 8px 12px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }

    .cards-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .card-item {
      background: #1e293b;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      border: 1px solid var(--accent);
    }
  </style>
</head>
<body>

  <header>
    <h2>SquadForge</h2>
    <button onclick="location.reload()">Reset</button>
  </header>

  <!-- معلومات الفريق واسم المستخدم فوق الملعب -->
  <div class="info-header">
    <input type="text" id="clubName" placeholder="Club Name">
    <input type="text" id="squadName" placeholder="Squad Name">
    <input type="text" id="managerName" placeholder="Head Coach / Manager">
    <input type="text" id="userName" placeholder="Your Name">
  </div>

  <!-- الملعب متجاوب مع الهواتف -->
  <div class="pitch-container">
    <div class="pitch-line center-line"></div>
    <div class="pitch-line center-circle"></div>
    <div class="pitch-line box-top"></div>
    <div class="pitch-line box-bottom"></div>

    <!-- الهجوم -->
    <div class="grid-row">
      <div class="player-slot"><div class="player-circle">LW</div><span>Add LW</span></div>
      <div class="player-slot"><div class="player-circle">ST</div><span>Add ST</span></div>
      <div class="player-slot"><div class="player-circle">RW</div><span>Add RW</span></div>
    </div>

    <!-- الوسط -->
    <div class="grid-row">
      <div class="player-slot"><div class="player-circle">CM</div><span>Add CM</span></div>
      <div class="player-slot"><div class="player-circle">CAM</div><span>Add CAM</span></div>
      <div class="player-slot"><div class="player-circle">CM</div><span>Add CM</span></div>
    </div>

    <!-- الدفاع -->
    <div class="grid-row">
      <div class="player-slot"><div class="player-circle">LB</div><span>Add LB</span></div>
      <div class="player-slot"><div class="player-circle">CB</div><span>Add CB</span></div>
      <div class="player-slot"><div class="player-circle">CB</div><span>Add CB</span></div>
      <div class="player-slot"><div class="player-circle">RB</div><span>Add RB</span></div>
    </div>

    <!-- حارس المرمى -->
    <div class="grid-row">
      <div class="player-slot"><div class="player-circle">GK</div><span>Add GK</span></div>
    </div>
  </div>

  <!-- قسم إدارة الكروت -->
  <div class="cards-section">
    <h3>Game Cards</h3>
    <br>
    <div class="cards-controls">
      <input type="text" id="newCardInput" placeholder="Enter Card Name">
      <button onclick="addCustomCard()">Add Card</button>
    </div>

    <div class="cards-controls">
      <input type="number" id="randomCountInput" placeholder="Count to draw" min="1">
      <button onclick="drawRandomCards()">Draw Random Cards</button>
    </div>

    <h4>Available Cards (<span id="cardCount">0</span>)</h4>
    <div class="cards-list" id="cardsContainer"></div>

    <h4 style="margin-top: 15px;">Drawn Cards</h4>
    <div class="cards-list" id="drawnCardsContainer"></div>
  </div>

  <script>
    let customCards = [];

    function addCustomCard() {
      const input = document.getElementById('newCardInput');
      const name = input.value.trim();
      if (!name) return;

      customCards.push(name);
      input.value = '';
      renderCards();
    }

    function renderCards() {
      const container = document.getElementById('cardsContainer');
      document.getElementById('cardCount').innerText = customCards.length;
      container.innerHTML = '';

      customCards.forEach((card, index) => {
        const cardDiv = document.createElement('div');
        cardDiv.className = 'card-item';
        cardDiv.innerText = card;
        container.appendChild(cardDiv);
      });
    }

    function drawRandomCards() {
      const countInput = document.getElementById('randomCountInput');
      const count = parseInt(countInput.value);

      if (isNaN(count) || count <= 0) {
        alert('الرجاء كتابة عدد صحيح للكروت المطلوب سحبها.');
        return;
      }

      if (count > customCards.length) {
        alert(`تنبيه: لا يوجد سوى ${customCards.length} كروت متاحة، لا يمكنك طلب سحب ${count} كروت!`);
        return;
      }

      // سحب عشوائي
      let tempCards = [...customCards];
      let drawn = [];

      for (let i = 0; i < count; i++) {
        const randomIndex = Math.floor(Math.random() * tempCards.length);
        drawn.push(tempCards.splice(randomIndex, 1)[0]);
      }

      const drawnContainer = document.getElementById('drawnCardsContainer');
      drawnContainer.innerHTML = '';
      drawn.forEach(card => {
        const cardDiv = document.createElement('div');
        cardDiv.className = 'card-item';
        cardDiv.style.borderColor = '#e11d48';
        cardDiv.innerText = card;
        drawnContainer.appendChild(cardDiv);
      });
    }
  </script>
</body>
</html>
