<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Manager</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600;700&family=Dancing+Script:wght@600&family=Cinzel:wght@600&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- JSZip Library for Zip Files -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    :root {
      --bg-main: #0f172a;
      --bg-side: #1e293b;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
      --radius: 12px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background-color: var(--bg-side);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .brand i {
      color: var(--accent);
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: var(--radius);
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
      font-weight: 500;
    }

    .nav-item:hover, .nav-item.active {
      background-color: var(--bg-hover);
      color: var(--text-main);
    }

    .nav-item.active {
      background-color: var(--accent);
      color: #fff;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Topbar */
    .topbar {
      padding: 16px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
    }

    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .crumb {
      cursor: pointer;
      transition: var(--transition);
    }

    .crumb:hover {
      color: var(--accent);
    }

    .action-btn-group {
      display: flex;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: var(--radius);
      border: none;
      background-color: var(--accent);
      color: #fff;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn:hover {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: var(--bg-hover);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    /* Content Area */
    .view-section {
      flex: 1;
      padding: 32px;
      overflow-y: auto;
      display: none;
      animation: fadeIn 0.3s ease-in-out;
    }

    .view-section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Grid Layout */
    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 140px;
      position: relative;
      cursor: pointer;
      transition: var(--transition);
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 10px 20px -5px rgba(0,0,0,0.3);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .card-icon {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      background-color: rgba(99, 102, 241, 0.1);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-menu {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      transition: var(--transition);
    }

    .card-menu:hover {
      color: var(--text-main);
      background-color: var(--bg-hover);
    }

    .card-title {
      font-weight: 600;
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 12px;
    }

    .card-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Editor View */
    .editor-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      background-color: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .editor-toolbar {
      padding: 12px 20px;
      background-color: #0f172a;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .font-select {
      background-color: var(--bg-hover);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      outline: none;
      cursor: pointer;
    }

    .editor-body {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    .line-numbers {
      width: 50px;
      background-color: #0f172a;
      border-right: 1px solid var(--border);
      color: var(--text-muted);
      padding: 16px 0;
      text-align: right;
      padding-right: 12px;
      font-family: 'Fira Code', monospace;
      font-size: 0.95rem;
      line-height: 1.6;
      user-select: none;
    }

    .editor-textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      padding: 16px;
      font-size: 0.95rem;
      line-height: 1.6;
      outline: none;
      resize: none;
      white-space: pre;
      overflow-x: auto;
    }

    /* Font Styles */
    .font-monospace { font-family: 'Fira Code', monospace; }
    .font-sans { font-family: 'Inter', sans-serif; }
    .font-serif { font-family: 'Times New Roman', serif; }
    .font-cursive { font-family: 'Dancing Script', cursive; font-size: 1.2rem; }
    .font-fancy { font-family: 'Cinzel', serif; }

    /* Notes View */
    .notes-layout {
      display: flex;
      gap: 24px;
      height: 100%;
    }

    .notes-sidebar {
      width: 260px;
      background-color: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .note-item {
      padding: 12px;
      border-radius: 8px;
      background-color: var(--bg-main);
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid transparent;
    }

    .note-item:hover, .note-item.active {
      border-color: var(--accent);
      background-color: var(--bg-hover);
    }

    .note-item-title {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }

    /* Dropdown Menu */
    .dropdown {
      position: absolute;
      top: 40px;
      right: 16px;
      background-color: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 100;
      display: none;
      flex-direction: column;
      width: 140px;
      overflow: hidden;
    }

    .dropdown.show {
      display: flex;
    }

    .dropdown-item {
      padding: 10px 14px;
      font-size: 0.85rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: var(--transition);
    }

    .dropdown-item:hover {
      background-color: var(--bg-hover);
    }

    .dropdown-item.danger {
      color: var(--danger);
    }

    .dropdown-item.danger:hover {
      background-color: rgba(239, 68, 68, 0.1);
    }

    /* Custom Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.2s ease;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 400px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .modal-input {
      background-color: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text-main);
      outline: none;
      font-size: 0.95rem;
    }

    .modal-input:focus {
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* Zip Preview List */
    .zip-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 300px;
      overflow-y: auto;
    }

    .zip-item {
      padding: 8px 12px;
      background-color: var(--bg-main);
      border-radius: 6px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Hidden File Input */
    #file-upload-input { display: none; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <i data-lucide="folder-git-2"></i>
      <span>File Manager</span>
    </div>
    <nav class="nav-list">
      <div class="nav-item active" onclick="switchNav('explorer')">
        <i data-lucide="files"></i>
        <span>Explorer</span>
      </div>
      <div class="nav-item" onclick="switchNav('notes')">
        <i data-lucide="notebook-pen"></i>
        <span>Notes</span>
      </div>
    </nav>
  </aside>

  <!-- Main Content Area -->
  <main class="main-content">
    <!-- Topbar -->
    <header class="topbar">
      <div class="breadcrumbs" id="breadcrumbs">
        <span class="crumb" onclick="navigateToFolder(null)">Root</span>
      </div>

      <div class="action-btn-group">
        <button class="btn btn-secondary" onclick="document.getElementById('file-upload-input').click()">
          <i data-lucide="upload"></i> Upload
        </button>
        <button class="btn btn-secondary" onclick="openCreateModal('folder')">
          <i data-lucide="folder-plus"></i> New Folder
        </button>
        <button class="btn" onclick="openCreateModal('file')">
          <i data-lucide="file-plus"></i> New File
        </button>
      </div>
      <input type="file" id="file-upload-input" onchange="handleFileUpload(event)">
    </header>

    <!-- Explorer View -->
    <section id="view-explorer" class="view-section active">
      <div class="file-grid" id="file-grid">
        <!-- Files & Folders injected dynamically -->
      </div>
    </section>

    <!-- Text Editor View -->
    <section id="view-editor" class="view-section">
      <div class="editor-container">
        <div class="editor-toolbar">
          <div style="display: flex; align-items: center; gap: 12px;">
            <button class="btn btn-secondary" onclick="closeEditor()" style="padding: 6px 12px;">
              <i data-lucide="arrow-left"></i> Back
            </button>
            <span id="editor-file-name" style="font-weight: 600;">file.txt</span>
          </div>
          <div style="display: flex; gap: 12px; align-items: center;">
            <select class="font-select" id="font-family-select" onchange="changeFont(this.value)">
              <option value="font-monospace">Monospace</option>
              <option value="font-sans">Sans-Serif</option>
              <option value="font-serif">Serif</option>
              <option value="font-cursive">Cursive</option>
              <option value="font-fancy">Fancy</option>
            </select>
            <button class="btn" onclick="saveActiveFile()">
              <i data-lucide="save"></i> Save
            </button>
          </div>
        </div>
        <div class="editor-body">
          <div class="line-numbers" id="line-numbers">1</div>
          <textarea class="editor-textarea font-monospace" id="editor-textarea" spellcheck="false" oninput="updateLineNumbers()"></textarea>
        </div>
      </div>
    </section>

    <!-- Notes View -->
    <section id="view-notes" class="view-section">
      <div class="notes-layout">
        <div class="notes-sidebar">
          <button class="btn" onclick="createNewNote()">
            <i data-lucide="plus"></i> New Note
          </button>
          <div id="notes-list" style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px;">
            <!-- Notes injected dynamically -->
          </div>
        </div>
        <div style="flex: 1;" class="editor-container">
          <div class="editor-toolbar">
            <input type="text" id="note-title-input" class="modal-input" style="background: transparent; border: none; font-size: 1.1rem; font-weight: 600;" placeholder="Note Title..." oninput="saveCurrentNote()">
            <button class="btn btn-secondary" onclick="deleteCurrentNote()" style="color: var(--danger);">
              <i data-lucide="trash-2"></i> Delete
            </button>
          </div>
          <textarea class="editor-textarea font-sans" id="note-body-input" placeholder="Type your note here..." oninput="saveCurrentNote()"></textarea>
        </div>
      </div>
    </section>
  </main>

  <!-- Custom Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-title" id="modal-title">Action</div>
      <div id="modal-body">
        <input type="text" class="modal-input" id="modal-input" style="width: 100%;" placeholder="Enter name...">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn" id="modal-confirm-btn">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    // System State
    let state = {
      items: JSON.parse(localStorage.getItem('fm_items')) || [],
      notes: JSON.parse(localStorage.getItem('fm_notes')) || [],
      currentFolderId: null,
      activeFileId: null,
      activeNoteId: null
    };

    // Initialize Icons
    lucide.createIcons();

    // Save State
    function saveToStorage() {
      localStorage.setItem('fm_items', JSON.stringify(state.items));
      localStorage.setItem('fm_notes', JSON.stringify(state.notes));
    }

    // Navigation Switch
    function switchNav(view) {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));

      if (view === 'explorer') {
        document.querySelectorAll('.nav-item')[0].classList.add('active');
        document.getElementById('view-explorer').classList.add('active');
        renderExplorer();
      } else if (view === 'notes') {
        document.querySelectorAll('.nav-item')[1].classList.add('active');
        document.getElementById('view-notes').classList.add('active');
        renderNotes();
      }
    }

    // Language Icon Logic
    function getFileIcon(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      switch (ext) {
        case 'js': return 'file-code-2';
        case 'py': return 'file-code';
        case 'html': return 'file-type-2';
        case 'css': return 'palette';
        case 'json': return 'file-json';
        case 'php': return 'file-spreadsheet';
        case 'cpp': case 'c': return 'cpu';
        case 'zip': return 'file-archive';
        default: return 'file-text';
      }
    }

    // Render Breadcrumbs
    function renderBreadcrumbs() {
      const container = document.getElementById('breadcrumbs');
      container.innerHTML = `<span class="crumb" onclick="navigateToFolder(null)">Root</span>`;
      
      let path = [];
      let currId = state.currentFolderId;

      while (currId) {
        const folder = state.items.find(i => i.id === currId);
        if (folder) {
          path.unshift(folder);
          currId = folder.parentId;
        } else {
          break;
        }
      }

      path.forEach(folder => {
        container.innerHTML += ` <i data-lucide="chevron-right" style="width: 14px;"></i> <span class="crumb" onclick="navigateToFolder('${folder.id}')">${folder.name}</span>`;
      });

      lucide.createIcons();
    }

    // Render Explorer Grid
    function renderExplorer() {
      renderBreadcrumbs();
      const grid = document.getElementById('file-grid');
      grid.innerHTML = '';

      const filteredItems = state.items.filter(item => item.parentId === state.currentFolderId);

      if (filteredItems.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px 0;">Folder is empty</div>`;
        return;
      }

      filteredItems.forEach(item => {
        const isFolder = item.type === 'folder';
        const iconName = isFolder ? 'folder' : getFileIcon(item.name);

        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = (e) => {
          if (!e.target.closest('.card-menu') && !e.target.closest('.dropdown')) {
            if (isFolder) navigateToFolder(item.id);
            else if (item.name.endsWith('.zip')) openZipModal(item);
            else openEditor(item.id);
          }
        };

        card.innerHTML = `
          <div class="card-header">
            <div class="card-icon">
              <i data-lucide="${iconName}"></i>
            </div>
            <button class="card-menu" onclick="toggleDropdown(event, '${item.id}')">
              <i data-lucide="more-vertical"></i>
            </button>
            <div class="dropdown" id="dropdown-${item.id}">
              ${!isFolder ? `<div class="dropdown-item" onclick="downloadItem('${item.id}')"><i data-lucide="download"></i> Download</div>` : ''}
              <div class="dropdown-item" onclick="openRenameModal('${item.id}')"><i data-lucide="edit-3"></i> Rename</div>
              <div class="dropdown-item" onclick="openMoveModal('${item.id}')"><i data-lucide="folder-input"></i> Move</div>
              <div class="dropdown-item danger" onclick="confirmDelete('${item.id}')"><i data-lucide="trash-2"></i> Delete</div>
            </div>
          </div>
          <div>
            <div class="card-title">${item.name}</div>
            <div class="card-meta">${isFolder ? 'Folder' : (item.size || '0 KB')}</div>
          </div>
        `;
        grid.appendChild(card);
      });

      lucide.createIcons();
    }

    function navigateToFolder(id) {
      state.currentFolderId = id;
      renderExplorer();
    }

    // Dropdown Handlers
    function toggleDropdown(e, id) {
      e.stopPropagation();
      document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'));
      const dropdown = document.getElementById(`dropdown-${id}`);
      if (dropdown) dropdown.classList.toggle('show');
    }

    document.addEventListener('click', () => {
      document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'));
    });

    // Custom Modal System
    function showModal(title, bodyHTML, onConfirm) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-body').innerHTML = bodyHTML;
      const overlay = document.getElementById('modal-overlay');
      overlay.classList.add('active');

      const confirmBtn = document.getElementById('modal-confirm-btn');
      confirmBtn.onclick = () => {
        onConfirm();
        closeModal();
      };
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('active');
    }

    // File/Folder Creation
    function openCreateModal(type) {
      const isFile = type === 'file';
      showModal(
        `Create New ${isFile ? 'File' : 'Folder'}`,
        `<input type="text" class="modal-input" id="create-input" style="width:100%;" placeholder="Enter ${isFile ? 'filename (e.g. malek.js)' : 'folder name'}...">`,
        () => {
          const name = document.getElementById('create-input').value.trim();
          if (!name) return;

          const newItem = {
            id: 'item_' + Date.now(),
            name: name,
            type: isFile ? 'file' : 'folder',
            content: isFile ? '' : null,
            parentId: state.currentFolderId,
            font: 'font-monospace',
            size: isFile ? '0 KB' : null
          };

          state.items.push(newItem);
          saveToStorage();
          renderExplorer();
        }
      );
    }

    // Rename Item
    function openRenameModal(id) {
      const item = state.items.find(i => i.id === id);
      if (!item) return;

      showModal(
        'Rename Item',
        `<input type="text" class="modal-input" id="rename-input" style="width:100%;" value="${item.name}">`,
        () => {
          const newName = document.getElementById('rename-input').value.trim();
          if (newName) {
            item.name = newName;
            saveToStorage();
            renderExplorer();
          }
        }
      );
    }

    // Move Item
    function openMoveModal(id) {
      const item = state.items.find(i => i.id === id);
      const folders = state.items.filter(i => i.type === 'folder' && i.id !== id);

      let options = `<option value="null">Root</option>`;
      folders.forEach(f => {
        options += `<option value="${f.id}" ${item.parentId === f.id ? 'selected' : ''}>${f.name}</option>`;
      });

      showModal(
        'Move Item',
        `<select class="modal-input" id="move-select" style="width:100%;">${options}</select>`,
        () => {
          const target = document.getElementById('move-select').value;
          item.parentId = target === 'null' ? null : target;
          saveToStorage();
          renderExplorer();
        }
      );
    }

    // Delete Confirmation
    function confirmDelete(id) {
      const item = state.items.find(i => i.id === id);
      showModal(
        'Confirm Deletion',
        `<p style="color: var(--text-muted);">Are you sure you want to delete <strong>${item.name}</strong>? This action cannot be undone.</p>`,
        () => {
          deleteRecursive(id);
          saveToStorage();
          renderExplorer();
        }
      );
    }

    function deleteRecursive(id) {
      const children = state.items.filter(i => i.parentId === id);
      children.forEach(c => deleteRecursive(c.id));
      state.items = state.items.filter(i => i.id !== id);
    }

    // File Upload Handler
    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      
      if (file.name.endsWith('.zip')) {
        reader.readAsArrayBuffer(file);
        reader.onload = function(evt) {
          const newItem = {
            id: 'item_' + Date.now(),
            name: file.name,
            type: 'file',
            zipBuffer: Array.from(new Uint8Array(evt.target.result)),
            parentId: state.currentFolderId,
            size: (file.size / 1024).toFixed(1) + ' KB'
          };
          state.items.push(newItem);
          saveToStorage();
          renderExplorer();
        }
      } else {
        reader.readAsText(file);
        reader.onload = function(evt) {
          const newItem = {
            id: 'item_' + Date.now(),
            name: file.name,
            type: 'file',
            content: evt.target.result,
            parentId: state.currentFolderId,
            font: 'font-monospace',
            size: (file.size / 1024).toFixed(1) + ' KB'
          };
          state.items.push(newItem);
          saveToStorage();
          renderExplorer();
        };
      }
    }

    // Open Zip Preview Modal
    function openZipModal(item) {
      if (!item.zipBuffer) return;
      const uint8 = new Uint8Array(item.zipBuffer);
      JSZip.loadAsync(uint8).then(zip => {
        let listHTML = `<div class="zip-list">`;
        zip.forEach((relativePath, zipEntry) => {
          listHTML += `<div class="zip-item"><i data-lucide="${zipEntry.dir ? 'folder' : 'file'}" style="width:16px;"></i> ${relativePath}</div>`;
        });
        listHTML += `</div>`;

        showModal(`ZIP Archive: ${item.name}`, listHTML, () => {});
        lucide.createIcons();
      });
    }

    // Editor Logic
    function openEditor(fileId) {
      const file = state.items.find(i => i.id === fileId);
      if (!file) return;

      state.activeFileId = fileId;
      document.getElementById('editor-file-name').innerText = file.name;
      const textarea = document.getElementById('editor-textarea');
      textarea.value = file.content || '';
      textarea.className = `editor-textarea ${file.font || 'font-monospace'}`;
      document.getElementById('font-family-select').value = file.font || 'font-monospace';

      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.getElementById('view-editor').classList.add('active');
      updateLineNumbers();
    }

    function closeEditor() {
      document.getElementById('view-editor').classList.remove('active');
      document.getElementById('view-explorer').classList.add('active');
      state.activeFileId = null;
    }

    function saveActiveFile() {
      const file = state.items.find(i => i.id === state.activeFileId);
      if (file) {
        file.content = document.getElementById('editor-textarea').value;
        file.font = document.getElementById('font-family-select').value;
        file.size = (new Blob([file.content]).size / 1024).toFixed(1) + ' KB';
        saveToStorage();
        closeEditor();
        renderExplorer();
      }
    }

    function updateLineNumbers() {
      const textarea = document.getElementById('editor-textarea');
      const lines = textarea.value.split('\n').length;
      const lineContainer = document.getElementById('line-numbers');
      lineContainer.innerHTML = Array.from({ length: lines }, (_, i) => i + 1).join('<br>');
    }

    function changeFont(fontClass) {
      const textarea = document.getElementById('editor-textarea');
      textarea.className = `editor-textarea ${fontClass}`;
    }

    // Download Handler
    function downloadItem(id) {
      const item = state.items.find(i => i.id === id);
      if (!item) return;

      const blob = new Blob([item.content || ''], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = item.name;
      a.click();
    }

    // Notes System Logic
    function renderNotes() {
      const container = document.getElementById('notes-list');
      container.innerHTML = '';

      state.notes.forEach(note => {
        const item = document.createElement('div');
        item.className = `note-item ${note.id === state.activeNoteId ? 'active' : ''}`;
        item.onclick = () => selectNote(note.id);
        item.innerHTML = `
          <div class="note-item-title">${note.title || 'Untitled Note'}</div>
          <div style="font-size: 0.75rem; color: var(--text-muted);">${note.date}</div>
        `;
        container.appendChild(item);
      });

      if (state.notes.length > 0 && !state.activeNoteId) {
        selectNote(state.notes[0].id);
      }
    }

    function createNewNote() {
      const newNote = {
        id: 'note_' + Date.now(),
        title: 'New Note',
        body: '',
        date: new Date().toLocaleDateString()
      };

      state.notes.unshift(newNote);
      saveToStorage();
      selectNote(newNote.id);
      renderNotes();
    }

    function selectNote(id) {
      state.activeNoteId = id;
      const note = state.notes.find(n => n.id === id);
      if (note) {
        document.getElementById('note-title-input').value = note.title;
        document.getElementById('note-body-input').value = note.body;
      }
      renderNotes();
    }

    function saveCurrentNote() {
      const note = state.notes.find(n => n.id === state.activeNoteId);
      if (note) {
        note.title = document.getElementById('note-title-input').value;
        note.body = document.getElementById('note-body-input').value;
        saveToStorage();
        renderNotes();
      }
    }

    function deleteCurrentNote() {
      if (!state.activeNoteId) return;
      state.notes = state.notes.filter(n => n.id !== state.activeNoteId);
      state.activeNoteId = null;
      document.getElementById('note-title-input').value = '';
      document.getElementById('note-body-input').value = '';
      saveToStorage();
      renderNotes();
    }

    // Initial Startup
    renderExplorer();
  </script>
</body>
</html>
