<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="yes">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0d12">
<title>File Manager & Notes Studio</title>
<style>
:root{
  --bg:#080a0f;--surface:#0e1219;--surface-2:#131923;--surface-3:#181f2b;
  --line:#242d3a;--text:#f4f7fb;--muted:#8d98aa;--accent:#7c5cff;
  --accent-2:#a48cff;--danger:#f05272;--success:#43d19e;
  --radius:16px;--shadow:0 24px 70px rgba(0,0,0,.5);
}
*{box-sizing:border-box;transition: background-color 0.25s ease, border-color 0.25s ease, font-family 0.3s ease, transform 0.2s ease;}
html,body{width:100%;height:100%;margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;}
button,input,textarea,select{font:inherit;color:inherit;}
button{cursor:pointer;border:none;outline:none;}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Base Layout */
.app{height:100vh;display:flex;flex-direction:row;}
.sidebar{
  width:260px;flex:0 0 260px;border-left:1px solid var(--line);background:rgba(10,13,18,.95);
  backdrop-filter:blur(20px);padding:18px 13px;display:flex;flex-direction:column;gap:8px;z-index:20;
}
.brand{display:flex;align-items:center;gap:11px;padding:10px;font-weight:800;font-size:18px;}
.brand-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#b8aaff;background:#17132a;border:1px solid #3a3266;}
.nav{
  width:100%;display:flex;align-items:center;gap:12px;background:transparent;
  color:var(--muted);padding:12px;border-radius:11px;text-align:right;
}
.nav:hover{background:rgba(255,255,255,.05);color:var(--text)}
.nav.active{background:linear-gradient(135deg,rgba(124,92,255,.25),rgba(124,92,255,.08));border:1px solid #30275a;color:#fff}
.sidebar-bottom{margin-top:auto;display:flex;flex-direction:column;gap:6px}

.main{min-width:0;flex:1;display:flex;flex-direction:column;height:100%;}
.topbar{
  height:65px;flex:0 0 65px;border-bottom:1px solid var(--line);background:rgba(8,10,15,.8);
  backdrop-filter:blur(18px);display:flex;align-items:center;gap:12px;padding:0 20px;z-index:10;
}
.breadcrumbs{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:x-auto;flex:1;color:var(--muted)}
.crumb{background:none;color:inherit;padding:5px 8px;border-radius:6px;}
.crumb:hover{color:#fff;background:rgba(255,255,255,.05)}
.crumb.current{color:#fff;font-weight:700}
.search{
  width:210px;background:var(--surface);border:1px solid var(--line);color:#fff;
  border-radius:10px;padding:8px 12px;outline:none;
}
.search:focus{border-color:var(--accent)}

.page{flex:1;overflow-y:auto;padding:20px;position:relative;}
.hero{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px;flex-wrap:wrap;}
h1{font-size:24px;margin:0;letter-spacing:-.02em}
.subtitle{color:var(--muted);font-size:12px;margin-top:4px;}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);
  background:var(--surface-2);color:#e9edf4;padding:9px 14px;border-radius:10px;font-size:13px;
}
.btn:hover{transform:translateY(-1px);background:var(--surface-3);border-color:#3d4859;}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#896cff;}
.btn.danger{background:rgba(240,82,114,.15);border-color:rgba(240,82,114,.3);color:#ff9eb2}
.btn.danger:hover{background:rgba(240,82,114,.3);}

/* Grid & Items */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.item-card{
  position:relative;min-height:150px;border:1px solid var(--line);border-radius:14px;
  background:linear-gradient(145deg,rgba(20,26,36,.9),rgba(13,17,24,.9));
  padding:16px;animation:fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;overflow:hidden;cursor:pointer;
  display:flex;flex-direction:column;justify-content:space-between;
}
.item-card:hover{transform:translateY(-3px);border-color:#3a4555;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.item-card.selected{border-color:var(--accent);background:rgba(124,92,255,.1);}
.item-checkbox{position:absolute;top:12px;right:12px;width:18px;height:18px;z-index:2;cursor:pointer;}
.item-icon{
  width:42px;height:42px;border-radius:10px;background:#191f2a;border:1px solid #2b3442;
  display:grid;place-items:center;font-size:11px;font-weight:800;color:#b8c1cf;
}
.item-icon.folder{color:#c9bbff;background:#211c34;border-color:#3a3260}
.item-name{font-weight:700;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;}
.item-meta{color:var(--muted);font-size:11px;margin-top:4px;}
.more-btn{
  position:absolute;left:10px;top:10px;background:transparent;color:var(--muted);
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
}
.more-btn:hover{background:rgba(255,255,255,.1);color:#fff}

/* Editor & Notes Overlay */
.editor{
  position:fixed;inset:0;background:var(--bg);z-index:150;display:none;flex-direction:column;
  animation:slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
.editor.show{display:flex;}
.editor-bar{height:60px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 15px;background:var(--surface);}
.editor-title{flex:1;min-width:0;}.editor-title input{width:100%;background:transparent;border:0;outline:0;color:#fff;font-weight:700;font-size:16px;}
.editor-body{display:flex;flex:1;min-height:0;position:relative;}
.line-numbers{
  width:45px;flex:0 0 45px;background:var(--surface-2);color:#566171;text-align:center;padding:15px 0;
  white-space:pre;overflow:hidden;line-height:1.6;font:13px monospace;user-select:none;border-left:1px solid var(--line);
}
.code-area{
  flex:1;min-width:0;resize:none;border:0;outline:0;background:#0d1118 !important;color:#eef2f7 !important;
  padding:15px;line-height:1.6;font:14px monospace;white-space:pre;overflow:auto;
}

/* Notes View */
.notes-layout{display:grid;grid-template-columns:260px 1fr;gap:15px;height:calc(100vh - 160px);}
.notes-sidebar,.note-editor{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.notes-sidebar{overflow-y:auto;display:flex;flex-direction:column;}
.note-row{padding:12px 15px;border-bottom:1px solid var(--line);cursor:pointer;}
.note-row:hover,.note-row.active{background:var(--surface-2);}
.note-row.selected{border-right:3px solid var(--accent);background:rgba(124,92,255,.15);}
.note-row b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;}
.note-row small{display:block;color:var(--muted);margin-top:4px;font-size:11px;}
.note-editor{display:flex;flex-direction:column;padding:15px;background:var(--surface);}
.note-editor textarea{
  flex:1;min-height:200px;resize:none;margin-top:10px;line-height:1.6;background:#0d1118 !important;
  color:#fff !important;border:1px solid var(--line);border-radius:10px;padding:12px;outline:none;
}

/* Dynamic Fonts for Notes & Editor */
.style-normal { font-family: system-ui, sans-serif !important; }
.style-handwritten { font-family: 'Comic Sans MS', cursive, sans-serif !important; }
.style-gothic { font-family: 'Times New Roman', serif !important; letter-spacing: 1px; }
.style-classic { font-family: Georgia, serif !important; }
.style-mono { font-family: monospace !important; }

/* Dialogs & Menus */
.menu{
  position:fixed;z-index:300;min-width:180px;padding:6px;border:1px solid var(--line);background:#151b24;
  border-radius:12px;box-shadow:var(--shadow);display:none;animation:fadeIn 0.15s ease;
}
.menu button{
  width:100%;display:flex;align-items:center;gap:9px;background:transparent;color:#dce2eb;
  padding:9px 12px;border-radius:8px;text-align:right;font-size:13px;
}
.menu button:hover{background:rgba(255,255,255,.08);color:#fff}
.menu button.danger{color:#ff9eb2}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);display:none;
  align-items:center;justify-content:center;z-index:400;padding:15px;
}
.modal-backdrop.show{display:flex;animation:fadeIn 0.2s ease;}
.modal{
  width:min(480px,100%);background:#151a23;border:1px solid #323c4a;border-radius:16px;
  box-shadow:var(--shadow);padding:20px;animation:slideUp 0.2s ease;
}
.modal h3{margin:0 0 10px;font-size:18px;}.modal p{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 15px;}
.field{margin:12px 0;}.field label{display:block;color:#9ca6b5;font-size:12px;margin-bottom:6px;}
.field input,.field select{
  width:100%;border:1px solid var(--line);outline:none;background:#0d1118;color:#fff;border-radius:9px;padding:10px;
}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

/* Custom Toast */
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(50px);z-index:500;
  background:#1a212d;border:1px solid var(--line);color:#fff;padding:10px 20px;border-radius:30px;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:all 0.3s ease;font-size:13px;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.empty{border:1px dashed var(--line);border-radius:14px;padding:40px 20px;text-align:center;color:var(--muted);width:100%;}

/* Animations */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}

/* Mobile Responsive */
@media(max-width:768px){
  .app{flex-direction:column-reverse;}
  .sidebar{
    width:100%;height:60px;flex:0 0 60px;flex-direction:row;padding:5px;justify-content:space-around;
    border-left:none;border-top:1px solid var(--line);background:#0a0d12;
  }
  .brand,.sidebar-bottom,.subtitle{display:none;}
  .nav{flex-direction:column;gap:3px;padding:6px;font-size:10px;justify-content:center;text-align:center;}
  .topbar{height:55px;padding:0 10px;}
  .search{width:130px;}
  .page{padding:12px;}
  .notes-layout{grid-template-columns:1fr;grid-template-rows:180px 1fr;height:calc(100vh - 140px);}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>

<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24"><path d="M4 7.5h6l1.7 2H20v9H4z"/><path d="M4 7.5V5.5h6l1.5 2"/></svg>
      </div>
      <span>إدارة الملفات</span>
    </div>
    <button class="nav active" data-view="files"><svg viewBox="0 0 24 24"><path d="M4 7.5h6l1.7 2H20v9H4z"/><path d="M4 7.5V5.5h6l1.5 2"/></svg><span>الملفات</span></button>
    <button class="nav" data-view="notes"><svg viewBox="0 0 24 24"><path d="M6 4h12v16H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg><span>المذكرات</span></button>
    <button class="nav" data-view="trash"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg><span>المحذوفات</span></button>
    
    <div class="sidebar-bottom">
      <button class="btn" onclick="$('#filePicker').click()"><svg viewBox="0 0 24 24"><path d="M12 4v11M8 11l4 4 4-4"/><path d="M5 19h14"/></svg> استيراد ملفات</button>
      <button class="btn" onclick="$('#folderPicker').click()"><svg viewBox="0 0 24 24"><path d="M4 7.5h6l1.7 2H20v9H4z"/><path d="M12 12v5M9.5 14.5h5"/></svg> استيراد مجلد</button>
      <input id="filePicker" type="file" multiple hidden>
      <input id="folderPicker" type="file" webkitdirectory directory multiple hidden>
    </div>
  </aside>

  <!-- Main View -->
  <main class="main">
    <header class="topbar">
      <div class="breadcrumbs" id="breadcrumbs"></div>
      <input class="search" id="search" autocomplete="off" placeholder="بحث...">
    </header>
    <section class="page" id="page"></section>
  </main>
</div>

<!-- Context Menu & Modals -->
<div class="menu" id="contextMenu"></div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<!-- Code / File Editor Overlay -->
<div class="editor" id="editor">
  <div class="editor-bar">
    <button class="btn danger" id="editorClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg> إغلاق</button>
    <div class="editor-title"><input id="editorName" aria-label="File name"></div>
    <select class="btn" id="editorStyle">
      <option value="normal">العادي</option>
      <option value="handwritten">يدوي</option>
      <option value="gothic">قوطي</option>
      <option value="classic">كلاسيك</option>
      <option value="mono">Monospace</option>
    </select>
    <button class="btn danger" id="editorClear">مسح الكل</button>
    <button class="btn primary" id="editorSave"><svg viewBox="0 0 24 24"><path d="M5 4h12l2 2v14H5z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/></svg> حفظ</button>
  </div>
  <div class="editor-body">
    <div class="line-numbers" id="lineNumbers">1</div>
    <textarea class="code-area" id="code" spellcheck="false"></textarea>
  </div>
</div>

<script>
/* IndexedDB Controller */
const DB_NAME = "FileManagerPro_DB";
const DB_VERSION = 2;
let db = null;
let currentView = "files";
let currentFolder = null;
let currentNoteFolder = null;
let selectedItems = new Set();
let selectedNotes = new Set();
let editorId = null;
let activeNoteId = null;
let hasUnsavedChanges = false;

const $ = (q) => document.querySelector(q);
const page = $("#page");
const search = $("#search");
const breadcrumbs = $("#breadcrumbs");
const modalBackdrop = $("#modalBackdrop");
const contextMenu = $("#contextMenu");

const ICONS = {
  folder: `<svg viewBox="0 0 24 24"><path d="M3.5 7.5h6l1.7 2H20v9h-16.5z"/><path d="M3.5 7.5V5.5h6l1.5 2"/></svg>`,
  file: `<svg viewBox="0 0 24 24"><path d="M6 3.5h8l4 4V20.5H6z"/><path d="M14 3.5v5h4M9 13h6M9 16h6"/></svg>`,
  more: `<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>`,
  zip: `<svg viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5z"/><path d="M15 4v5h4M12 7v2M10.5 11h3M12 14v6"/></svg>`
};

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

function openDatabase() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains("items")) d.createObjectStore("items", {keyPath:"id"});
      if (!d.objectStoreNames.contains("notes")) d.createObjectStore("notes", {keyPath:"id"});
      if (!d.objectStoreNames.contains("trash")) d.createObjectStore("trash", {keyPath:"id"});
    };
    req.onsuccess = () => { db = req.result; resolve(); };
    req.onerror = () => reject(req.error);
  });
}

function req(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
function store(name, mode = "readonly") { return db.transaction(name, mode).objectStore(name); }
function dbGet(storeName, id) { return req(store(storeName).get(id)); }
function dbAll(storeName) { return req(store(storeName).getAll()); }
function dbPut(storeName, val) { return req(store(storeName, "readwrite").put(val)); }
function dbDel(storeName, id) { return req(store(storeName, "readwrite").delete(id)); }

function showToast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => t.classList.remove("show"), 2200);
}

function closeModal() { modalBackdrop.classList.remove("show"); }
function openModal(title, body, actions) {
  $("#modal").innerHTML = `<h3>${title}</h3>${body}<div class="modal-actions">${actions}</div>`;
  modalBackdrop.classList.add("show");
}

function askText(title, label, value, cb) {
  openModal(title, `<div class="field"><label>${label}</label><input id="mTxt" value="${value || ''}"></div>`,
    `<button class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary" id="mOk">تأكيد</button>`);
  setTimeout(() => $("#mTxt").focus(), 50);
  $("#mOk").onclick = () => { const v = $("#mTxt").value.trim(); if(v){ closeModal(); cb(v); }};
}

function confirmAction(title, msg, danger = true, cb) {
  openModal(title, `<p>${msg}</p>`,
    `<button class="btn" onclick="closeModal()">إلغاء</button><button class="btn ${danger?'danger':'primary'}" id="cOk">تأكيد</button>`);
  $("#cOk").onclick = () => { closeModal(); cb(); };
}

/* Back Button Mobile Handler */
window.addEventListener('popstate', (e) => {
  if ($("#editor").classList.contains("show")) {
    handleEditorClose();
  } else if (modalBackdrop.classList.contains("show")) {
    closeModal();
  } else if (currentFolder || currentNoteFolder) {
    if (currentView === 'files') { currentFolder = null; renderFiles(); }
    if (currentView === 'notes') { currentNoteFolder = null; renderNotes(); }
  }
});

function pushState() { history.pushState({page:1}, ""); }

/* Navigation Routing */
function navigate(viewName) {
  currentView = viewName;
  document.querySelectorAll(".nav").forEach(b => b.classList.toggle("active", b.dataset.view === viewName));
  selectedItems.clear();
  selectedNotes.clear();
  if (viewName === "files") renderFiles();
  if (viewName === "notes") renderNotes();
  if (viewName === "trash") renderTrash();
}

document.querySelectorAll(".nav[data-view]").forEach(b => {
  b.addEventListener("click", () => navigate(b.dataset.view));
});

search.addEventListener("input", () => {
  if (currentView === "files") drawFileGrid();
  if (currentView === "notes") drawNotesList();
  if (currentView === "trash") drawTrashGrid();
});

/* FILES ENGINE */
async function getChildren(parentId, source = "items") {
  const all = await dbAll(source);
  return all.filter(item => (item.parent || null) === (parentId || null));
}

async function renderFiles() {
  currentView = "files";
  pushState();
  buildBreadcrumbs();
  page.innerHTML = `
    <div class="hero">
      <div>
        <h1>الملفات</h1>
        <div class="subtitle">إدارة وتصفح الملفات والمجلدات</div>
      </div>
    </div>
    <div class="toolbar">
      <button class="btn primary" onclick="createNewFile()">ملف جديد</button>
      <button class="btn" onclick="createNewFolder()">مجلد جديد</button>
      <button class="btn" id="bulkZipBtn" style="display:none;" onclick="zipSelectedItems()">ضغط المقتنيات (.zip)</button>
      <button class="btn danger" id="bulkDeleteBtn" style="display:none;" onclick="deleteSelectedItems()">حذف المحدد</button>
    </div>
    <div class="grid" id="fileGrid"></div>
  `;
  await drawFileGrid();
}

async function buildBreadcrumbs() {
  let parts = [];
  let curr = currentFolder ? await dbGet("items", currentFolder) : null;
  while(curr) {
    parts.unshift(curr);
    curr = curr.parent ? await dbGet("items", curr.parent) : null;
  }
  breadcrumbs.innerHTML = `<button class="crumb ${parts.length?'':'current'}" onclick="currentFolder=null;renderFiles();">الرئيسية</button>` +
    parts.map((p, i) => ` / <button class="crumb ${i===parts.length-1?'current':''}" onclick="currentFolder='${p.id}';renderFiles();">${p.name}</button>`).join("");
}

async function drawFileGrid() {
  const grid = $("#fileGrid");
  let items = await getChildren(currentFolder);
  const q = search.value.trim().toLowerCase();
  if (q) items = items.filter(i => i.name.toLowerCase().includes(q));

  if (!items.length) {
    grid.innerHTML = `<div class="empty">لا توجد ملفات هنا</div>`;
    return;
  }

  grid.innerHTML = items.map(item => `
    <div class="item-card ${selectedItems.has(item.id)?'selected':''}" onclick="handleItemClick(event, '${item.id}', '${item.type}', '${item.name}')">
      <input type="checkbox" class="item-checkbox" ${selectedItems.has(item.id)?'checked':''} onclick="event.stopPropagation();toggleSelectItem('${item.id}')">
      <button class="more-btn" onclick="event.stopPropagation();openContextMenu(event, '${item.id}', 'file')">${ICONS.more}</button>
      <div class="item-icon ${item.type==='folder'?'folder':''}">${item.type==='folder'?ICONS.folder:(item.name.endsWith('.zip')?ICONS.zip:ICONS.file)}</div>
      <div class="item-name">${item.name}</div>
      <div class="item-meta">${item.type==='folder'?'مجلد':(item.size? (item.size/1024).toFixed(1)+' KB':'ملف نصي')}</div>
    </div>
  `).join("");
}

function toggleSelectItem(id) {
  if (selectedItems.has(id)) selectedItems.delete(id); else selectedItems.add(id);
  const showBulk = selectedItems.size > 0;
  if ($("#bulkZipBtn")) $("#bulkZipBtn").style.display = showBulk ? "inline-flex" : "none";
  if ($("#bulkDeleteBtn")) $("#bulkDeleteBtn").style.display = showBulk ? "inline-flex" : "none";
  drawFileGrid();
}

function handleItemClick(e, id, type, name) {
  if (name.endsWith('.zip')) {
    openModal("ملف مضغوط", `<p>هذا ملف مضغوط ZIP. يجب فك الضغط أولاً لتتمكن من استعراض محتوياته داخل مجلد مخصص.</p>`,
      `<button class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary" onclick="closeModal();extractZip('${id}')">فك الضغط الآن</button>`);
    return;
  }
  if (type === "folder") {
    currentFolder = id;
    renderFiles();
  } else {
    openFileEditor(id);
  }
}

function createNewFile() {
  askText("ملف جديد", "اسم الملف مع الامتداد", "untitled.txt", async name => {
    const file = { id: uid(), name, type: "file", parent: currentFolder, content: "", style: "normal", createdAt: Date.now() };
    await dbPut("items", file);
    renderFiles();
    openFileEditor(file.id);
  });
}

function createNewFolder() {
  askText("مجلد جديد", "اسم المجلد", "مجلد جديد", async name => {
    await dbPut("items", { id: uid(), name, type: "folder", parent: currentFolder, createdAt: Date.now() });
    renderFiles();
  });
}

/* File Actions & ZIP Logic */
async function extractZip(id) {
  const item = await dbGet("items", id);
  if (!item) return;
  try {
    const zip = await JSZip.loadAsync(item.content);
    const targetFolderId = uid();
    await dbPut("items", { id: targetFolderId, name: item.name.replace('.zip', ''), type: "folder", parent: currentFolder, createdAt: Date.now() });

    for (let filename of Object.keys(zip.files)) {
      const fileObj = zip.files[filename];
      if (!fileObj.dir) {
        const text = await fileObj.async("string");
        const cleanName = filename.split('/').pop();
        if (cleanName) {
          await dbPut("items", { id: uid(), name: cleanName, type: "file", parent: targetFolderId, content: text, size: text.length, createdAt: Date.now() });
        }
      }
    }
    showToast("تم فك الضغط بنجاح إلى مجلد جديد");
    renderFiles();
  } catch(e) {
    showToast("خطأ في فك ضغط الملف");
  }
}

async function zipSelectedItems() {
  if (!selectedItems.size) return;
  const zip = new JSZip();
  const items = await dbAll("items");
  
  for (let id of selectedItems) {
    const item = items.find(i => i.id === id);
    if (item && item.type === "file") {
      zip.file(item.name, item.content || "");
    }
  }

  const content = await zip.generateAsync({type:"string"});
  await dbPut("items", { id: uid(), name: `archive_${Date.now().toString().slice(-4)}.zip`, type: "file", parent: currentFolder, content: content, size: content.length });
  selectedItems.clear();
  showToast("تم انشاء الملف المضغوط");
  renderFiles();
}

async function deleteSelectedItems() {
  confirmAction("تأكيد الحذف", `هل أنت تأكد من نقل ${selectedItems.size} عناصر إلى سلة المحذوفات؟`, true, async () => {
    for (let id of selectedItems) {
      const item = await dbGet("items", id);
      if (item) {
        item.deletedAt = Date.now();
        await dbPut("trash", item);
        await dbDel("items", id);
      }
    }
    selectedItems.clear();
    showToast("تم النقل للسلة");
    renderFiles();
  });
}

/* Editor Logic */
async function openFileEditor(id) {
  const item = await dbGet("items", id);
  if (!item) return;
  editorId = id;
  hasUnsavedChanges = false;
  $("#editorName").value = item.name;
  $("#code").value = item.content || "";
  $("#editorStyle").value = item.style || "normal";
  applyEditorStyle(item.style || "normal");
  $("#editor").classList.add("show");
  pushState();
  updateLineNumbers();
}

function applyEditorStyle(s) { $("#code").className = "code-area style-" + s; }
$("#editorStyle").addEventListener("change", (e) => { applyEditorStyle(e.target.value); hasUnsavedChanges = true; });
$("#code").addEventListener("input", () => { updateLineNumbers(); hasUnsavedChanges = true; });

function updateLineNumbers() {
  const lines = $("#code").value.split("\n").length;
  $("#lineNumbers").textContent = Array.from({length: lines}, (_, i) => i + 1).join("\n");
}

// Sync Scrolling between Code & Line Numbers
$("#code").addEventListener("scroll", function() {
  $("#lineNumbers").scrollTop = this.scrollTop;
});

$("#editorClear").onclick = () => {
  confirmAction("مسح النص", "هل أنت تأكد من مسح جميع النصوص داخل الملف؟", true, () => {
    $("#code").value = "";
    updateLineNumbers();
    hasUnsavedChanges = true;
  });
};

function handleEditorClose() {
  if (hasUnsavedChanges) {
    confirmAction("تغييرات غير محفوظة", "هل تريد الحفظ قبل الخروج؟", false, async () => {
      await saveFileChanges();
      $("#editor").classList.remove("show");
    });
  } else {
    $("#editor").classList.remove("show");
  }
}

$("#editorClose").onclick = handleEditorClose;

async function saveFileChanges() {
  if (!editorId) return;
  const item = await dbGet("items", editorId);
  item.name = $("#editorName").value.trim() || item.name;
  item.content = $("#code").value;
  item.style = $("#editorStyle").value;
  item.size = item.content.length;
  await dbPut("items", item);
  hasUnsavedChanges = false;
  showToast("تم الحفظ بنجاح");
  renderFiles();
}
$("#editorSave").onclick = saveFileChanges;

/* NOTES ENGINE */
async function renderNotes() {
  currentView = "notes";
  pushState();
  breadcrumbs.innerHTML = `<span class="crumb current">المذكرات</span>`;
  page.innerHTML = `
    <div class="hero">
      <div><h1>دفتر المذكرات</h1><div class="subtitle">تعديل وتنسيق المذكرات المخصصة</div></div>
      <div style="display:flex;gap:8px;">
        <button class="btn" onclick="createNoteFolder()">مجلد مذكرات جديد</button>
        <button class="btn primary" onclick="createNewNote()">مذكرة جديدة</button>
      </div>
    </div>
    <div class="notes-layout">
      <div class="notes-sidebar" id="notesList"></div>
      <div class="note-editor" id="noteEditor">
        <div class="empty">اختر أو أنشئ مذكرة للبدء</div>
      </div>
    </div>
  `;
  await drawNotesList();
}

async function drawNotesList() {
  const container = $("#notesList");
  let notes = await dbAll("notes");
  const q = search.value.trim().toLowerCase();
  if (q) notes = notes.filter(n => n.title.toLowerCase().includes(q));

  if (!notes.length) {
    container.innerHTML = `<div class="empty" style="border:none;">لا توجد مذكرات</div>`;
    return;
  }

  container.innerHTML = notes.map(n => `
    <div class="note-row ${n.id===activeNoteId?'active':''} ${selectedNotes.has(n.id)?'selected':''}" onclick="selectNote('${n.id}')">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <b>${n.title || 'مذكرة جديدة'}</b>
        <button class="more-btn" onclick="event.stopPropagation();openContextMenu(event, '${n.id}', 'note')">${ICONS.more}</button>
      </div>
      <small>${(n.content||'').slice(0, 30)}...</small>
    </div>
  `).join("");
}

async function createNoteFolder() {
  askText("مجلد مذكرات", "اسم المجلد", "مذكرات خاصة", async name => {
    await dbPut("items", { id: uid(), name: "[M] " + name, type: "folder", isNoteFolder: true });
    showToast("تم إنشاء مجلد المذكرات");
  });
}

async function createNewNote() {
  const note = { id: uid(), title: "مذكرة جديد", content: "", style: "normal", modifiedAt: Date.now() };
  await dbPut("notes", note);
  activeNoteId = note.id;
  await drawNotesList();
  selectNote(note.id);
}

async function selectNote(id) {
  activeNoteId = id;
  const note = await dbGet("notes", id);
  if (!note) return;
  drawNotesList();

  const editor = $("#noteEditor");
  editor.innerHTML = `
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px;">
      <input id="noteTitle" value="${note.title}" style="flex:1;background:transparent;border:none;border-bottom:1px solid var(--line);color:#fff;font-weight:bold;padding:5px;">
      <select id="noteStyle" class="btn">
        <option value="normal" ${note.style==='normal'?'selected':''}>خط عادي</option>
        <option value="handwritten" ${note.style==='handwritten'?'selected':''}>خط يدوي</option>
        <option value="gothic" ${note.style==='gothic'?'selected':''}>خط قوطي</option>
        <option value="classic" ${note.style==='classic'?'selected':''}>كلاسيك</option>
      </select>
    </div>
    <textarea id="noteContent" class="style-${note.style||'normal'}">${note.content||''}</textarea>
    <div class="modal-actions">
      <button class="btn danger" onclick="clearNoteText()">مسح النص</button>
      <button class="btn danger" onclick="deleteSingleNote('${note.id}')">حذف المذكرة</button>
      <button class="btn primary" onclick="saveActiveNote('${note.id}')">حفظ التغييرات</button>
    </div>
  `;

  $("#noteStyle").onchange = (e) => {
    $("#noteContent").className = "style-" + e.target.value;
  };
}

function clearNoteText() {
  confirmAction("مسح المحتوى", "هل أنت تأكد من مسح كافة النصوص داخل المذكرة؟", true, () => {
    $("#noteContent").value = "";
  });
}

async function saveActiveNote(id) {
  const note = await dbGet("notes", id);
  note.title = $("#noteTitle").value.trim() || "بدون عنوان";
  note.content = $("#noteContent").value;
  note.style = $("#noteStyle").value;
  note.modifiedAt = Date.now();
  await dbPut("notes", note);
  showToast("تم حفظ المذكرة");
  drawNotesList();
}

async function deleteSingleNote(id) {
  confirmAction("حذف المذكرة", "سيتم نقل المذكرة لسلة المحذوفات", true, async () => {
    const note = await dbGet("notes", id);
    note.deletedAt = Date.now();
    await dbPut("trash", note);
    await dbDel("notes", id);
    activeNoteId = null;
    renderNotes();
    showToast("تم النقل للسلة");
  });
}

/* TRASH ENGINE */
async function renderTrash() {
  currentView = "trash";
  pushState();
  breadcrumbs.innerHTML = `<span class="crumb current">سلة المحذوفات</span>`;
  page.innerHTML = `
    <div class="hero">
      <div><h1>سلة المحذوفات</h1><div class="subtitle">إدارة العناصر المحذوفة</div></div>
      <div style="display:flex;gap:8px;">
        <button class="btn" onclick="restoreAllTrash()">إستعادة الكل</button>
        <button class="btn danger" onclick="emptyAllTrash()">تفريغ السلة بالكامل</button>
      </div>
    </div>
    <div class="grid" id="trashGrid"></div>
  `;
  await drawTrashGrid();
}

async function drawTrashGrid() {
  const grid = $("#trashGrid");
  const items = await dbAll("trash");
  if (!items.length) {
    grid.innerHTML = `<div class="empty">السلة فارغة تماماً</div>`;
    return;
  }

  grid.innerHTML = items.map(item => `
    <div class="item-card">
      <div class="item-name">${item.name || item.title}</div>
      <div class="item-meta">تاريخ الحذف: ${new Date(item.deletedAt).toLocaleDateString('ar-EG')}</div>
      <div class="modal-actions" style="margin-top:10px;">
        <button class="btn" onclick="restoreTrashItem('${item.id}')">إستعادة</button>
        <button class="btn danger" onclick="purgeTrashItem('${item.id}')">حذف نهائي</button>
      </div>
    </div>
  `).join("");
}

async function restoreTrashItem(id) {
  const item = await dbGet("trash", id);
  delete item.deletedAt;
  if (item.title !== undefined) {
    await dbPut("notes", item);
  } else {
    await dbPut("items", item);
  }
  await dbDel("trash", id);
  showToast("تمت الاستعادة بنجاح");
  renderTrash();
}

async function purgeTrashItem(id) {
  confirmAction("حذف نهائي", "لا يمكن التراجع عن هذه العملية!", true, async () => {
    await dbDel("trash", id);
    showToast("تم الحذف النهائي");
    renderTrash();
  });
}

async function restoreAllTrash() {
  const items = await dbAll("trash");
  for(let item of items) {
    delete item.deletedAt;
    if (item.title !== undefined) await dbPut("notes", item);
    else await dbPut("items", item);
    await dbDel("trash", item.id);
  }
  showToast("تم استعادة كافة العناصر");
  renderTrash();
}

async function emptyAllTrash() {
  confirmAction("تفريغ السلة", "سيتم حذف جميع المحتويات نهائياً!", true, async () => {
    const items = await dbAll("trash");
    for(let item of items) await dbDel("trash", item.id);
    showToast("تم تفريغ السلة");
    renderTrash();
  });
}

/* CONTEXT MENU & INFO SYSTEM */
async function openContextMenu(e, id, type) {
  contextMenu.innerHTML = "";
  contextMenu.style.display = "block";
  contextMenu.style.left = Math.min(e.clientX, window.innerWidth - 190) + "px";
  contextMenu.style.top = Math.min(e.clientY, window.innerHeight - 200) + "px";

  if (type === 'file') {
    const item = await dbGet("items", id);
    addMenuBtn("معلومات العنصر", () => showInfoModal(item));
    if (item.type === 'file') addMenuBtn("تحميل الملف", () => downloadFile(item));
    addMenuBtn("حذف", () => {
      confirmAction("حذف", "هل تريد نقل العنصر للسلة؟", true, async () => {
        item.deletedAt = Date.now();
        await dbPut("trash", item);
        await dbDel("items", id);
        renderFiles();
      });
    }, true);
  } else if (type === 'note') {
    const note = await dbGet("notes", id);
    addMenuBtn("معلومات المذكرة", () => showNoteInfoModal(note));
    addMenuBtn("تحميل المذكرة", () => downloadNote(note));
    addMenuBtn("حذف المذكرة", () => deleteSingleNote(id), true);
  }
}

function addMenuBtn(text, cb, danger = false) {
  const b = document.createElement("button");
  b.textContent = text;
  if (danger) b.classList.add("danger");
  b.onclick = () => { contextMenu.style.display="none"; cb(); };
  contextMenu.appendChild(b);
}

document.addEventListener("click", () => contextMenu.style.display = "none");

async function showInfoModal(item) {
  if (item.type === "file") {
    const lines = (item.content || "").split("\n").length;
    const chars = (item.content || "").length;
    openModal("تفاصيل الملف", `
      <p><b>الاسم:</b> ${item.name}</p>
      <p><b>عدد الأسطر:</b> ${lines}</p>
      <p><b>عدد الحروف:</b> ${chars}</p>
      <p><b>الحجم:</b> ${(chars/1024).toFixed(2)} KB</p>
    `, `<button class="btn primary" onclick="closeModal()">إغلاق</button>`);
  } else {
    const all = await dbAll("items");
    const subFiles = all.filter(i => i.parent === item.id);
    openModal("تفاصيل المجلد", `
      <p><b>اسم المجلد:</b> ${item.name}</p>
      <p><b>العناصر بالداخل:</b> ${subFiles.length}</p>
      <p><b>عدد المجلدات:</b> ${subFiles.filter(i=>i.type==='folder').length}</p>
      <p><b>عدد الملفات:</b> ${subFiles.filter(i=>i.type==='file').length}</p>
    `, `<button class="btn primary" onclick="closeModal()">إغلاق</button>`);
  }
}

function showNoteInfoModal(note) {
  const chars = (note.content || "").length;
  const lines = (note.content || "").split("\n").length;
  openModal("تفاصيل المذكرة", `
    <p><b>العنوان:</b> ${note.title}</p>
    <p><b>عدد الحروف:</b> ${chars}</p>
    <p><b>عدد الأسطر:</b> ${lines}</p>
  `, `<button class="btn primary" onclick="closeModal()">إغلاق</button>`);
}

function downloadFile(item) {
  const blob = new Blob([item.content || ""], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = item.name;
  a.click();
}

function downloadNote(note) {
  const blob = new Blob([note.content || ""], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${note.title}.txt`;
  a.click();
}

/* File Import Listeners */
$("#filePicker").onchange = async (e) => {
  const files = Array.from(e.target.files);
  for(let f of files) {
    const txt = await f.text();
    await dbPut("items", { id: uid(), name: f.name, type: "file", parent: currentFolder, content: txt, size: f.size, createdAt: Date.now() });
  }
  showToast("تم استيراد الملفات");
  renderFiles();
};

$("#folderPicker").onchange = async (e) => {
  const files = Array.from(e.target.files);
  const folderMap = {};
  for (let f of files) {
    const parts = f.webkitRelativePath.split("/");
    let parent = currentFolder;
    for (let i = 0; i < parts.length - 1; i++) {
      const pathKey = parts.slice(0, i + 1).join("/");
      if (!folderMap[pathKey]) {
        const newFoldId = uid();
        await dbPut("items", { id: newFoldId, name: parts[i], type: "folder", parent: parent, createdAt: Date.now() });
        folderMap[pathKey] = newFoldId;
      }
      parent = folderMap[pathKey];
    }
    const txt = await f.text();
    await dbPut("items", { id: uid(), name: f.name, type: "file", parent: parent, content: txt, size: f.size, createdAt: Date.now() });
  }
  showToast("تم استيراد المجلد بنجاح");
  renderFiles();
};

/* Start App */
openDatabase().then(() => renderFiles());
</script>
