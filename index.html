<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0d12">
<title>File Manager</title>
<style>
:root{
  --bg:#080a0f;--surface:#0e1219;--surface-2:#131923;--surface-3:#181f2b;
  --line:#242d3a;--text:#f4f7fb;--muted:#8d98aa;--accent:#7c5cff;
  --accent-2:#a48cff;--danger:#f05272;--success:#43d19e;
  --radius:16px;--shadow:0 24px 70px rgba(0,0,0,.42);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{
  background:
    radial-gradient(circle at 12% -10%,rgba(124,92,255,.20),transparent 34%),
    radial-gradient(circle at 90% 100%,rgba(55,130,255,.08),transparent 28%),var(--bg);
  color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow:hidden;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{height:100%;display:flex}
.sidebar{
  width:250px;flex:0 0 250px;border-right:1px solid var(--line);background:rgba(10,13,18,.82);
  backdrop-filter:blur(20px);padding:18px 13px;display:flex;flex-direction:column;gap:7px;z-index:20
}
.brand{display:flex;align-items:center;gap:11px;padding:11px 12px 25px;font-weight:800;font-size:18px;letter-spacing:-.02em}
.brand-mark{width:32px;height:32px;border:1px solid #3a3266;border-radius:10px;display:grid;place-items:center;color:#b8aaff;background:#17132a}
.nav{
  width:100%;display:flex;align-items:center;gap:12px;border:1px solid transparent;background:transparent;
  color:var(--muted);padding:11px 12px;border-radius:11px;text-align:left;transition:.2s
}
.nav:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav.active{background:linear-gradient(135deg,rgba(124,92,255,.18),rgba(124,92,255,.06));border-color:#30275a;color:#fff}
.sidebar-bottom{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.main{min-width:0;flex:1;display:flex;flex-direction:column}
.topbar{
  height:72px;flex:0 0 72px;border-bottom:1px solid var(--line);background:rgba(8,10,15,.68);
  backdrop-filter:blur(18px);display:flex;align-items:center;gap:12px;padding:0 22px;position:relative;z-index:10
}
.breadcrumbs{display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:auto;flex:1;color:var(--muted);min-width:0}
.crumb{border:0;background:none;color:inherit;padding:5px 4px;border-radius:7px}
.crumb:hover{color:#fff;background:rgba(255,255,255,.04)}
.crumb.current{color:#fff;font-weight:700}
.search{
  width:230px;flex:0 0 230px;background:var(--surface);border:1px solid var(--line);color:#fff;
  outline:none;border-radius:11px;padding:10px 12px;transition:.2s
}
.search:focus{border-color:#50427f;box-shadow:0 0 0 3px rgba(124,92,255,.1)}
.page{flex:1;overflow:auto;padding:25px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:22px}
h1{font-size:29px;line-height:1;margin:0 0 8px;letter-spacing:-.035em}
.subtitle{color:var(--muted);font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);
  background:var(--surface-2);color:#e9edf4;padding:10px 13px;border-radius:11px;transition:.18s
}
.btn:hover{transform:translateY(-1px);border-color:#3d4859;background:var(--surface-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#896cff;border-color:#896cff}
.btn.danger{background:rgba(240,82,114,.09);border-color:rgba(240,82,114,.28);color:#ff9eb2}
.btn.ghost{background:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px}
.item-card{
  position:relative;min-height:170px;border:1px solid var(--line);border-radius:17px;
  background:linear-gradient(145deg,rgba(20,26,36,.98),rgba(13,17,24,.98));
  padding:18px;transition:.22s;animation:rise .3s ease both;overflow:hidden;cursor:pointer
}
.item-card:hover{transform:translateY(-4px);border-color:#3a4555;box-shadow:0 15px 35px rgba(0,0,0,.18)}
.item-icon{
  width:48px;height:48px;border-radius:13px;background:#191f2a;border:1px solid #2b3442;
  display:grid;place-items:center;font-size:11px;font-weight:800;letter-spacing:-.02em;color:#b8c1cf;margin-bottom:25px
}
.item-icon.folder{color:#c9bbff;background:#211c34;border-color:#3a3260}
.item-icon.js{color:#ffe76a;background:#27261c}.item-icon.py{color:#70c8ff;background:#17242c}
.item-icon.html{color:#ff8d74;background:#2a1d1a}.item-icon.css{color:#71a8ff;background:#182031}
.item-icon.json{color:#b8c1cf}.item-icon.zip{color:#d8b4ff;background:#241b2e}
.item-name{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-meta{color:var(--muted);font-size:12px;margin-top:6px}
.more{
  position:absolute;right:10px;top:10px;border:0;background:transparent;color:#8d98aa;width:34px;height:34px;
  border-radius:9px;display:grid;place-items:center
}
.more:hover{background:rgba(255,255,255,.06);color:#fff}
.empty{
  border:1px dashed #2c3542;border-radius:16px;min-height:190px;display:grid;place-items:center;
  color:var(--muted);text-align:center;padding:30px;width:100%
}
.menu{
  position:fixed;z-index:100;min-width:205px;padding:6px;border:1px solid #343e4d;background:#151b24;
  border-radius:13px;box-shadow:var(--shadow);animation:pop .14s ease;display:none
}
.menu button{
  width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#dce2eb;
  padding:10px;border-radius:9px;text-align:left
}
.menu button:hover{background:rgba(255,255,255,.06);color:#fff}
.menu button.danger{color:#ff9eb2}
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(9px);display:none;
  align-items:center;justify-content:center;z-index:200;padding:20px
}
.modal-backdrop.show{display:flex;animation:fade .15s ease}
.modal{
  width:min(540px,100%);background:#151a23;border:1px solid #323c4a;border-radius:19px;
  box-shadow:var(--shadow);padding:22px;animation:modalIn .18s ease
}
.modal h2{margin:0 0 7px;font-size:20px}.modal p{color:var(--muted);line-height:1.55;margin:0 0 15px}
.field{margin:13px 0}.field label{display:block;color:#9ca6b5;font-size:12px;margin:0 0 7px}
.field input,.field textarea,.field select{
  width:100%;border:1px solid var(--line);outline:none;background:#0d1118;color:#fff;border-radius:11px;padding:11px 12px
}
.field textarea{min-height:150px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#55478b}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.editor{
  position:fixed;inset:0;background:#080a0e;z-index:150;display:none;flex-direction:column
}
.editor.show{display:flex;animation:fade .15s ease}
.editor-bar{height:65px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:10px 14px}
.editor-title{flex:1;min-width:0}.editor-title input{width:100%;background:transparent;border:0;outline:0;color:#fff;font-weight:750;font-size:15px}
.editor-body{display:flex;flex:1;min-height:0}
.line-numbers{
  width:58px;flex:0 0 58px;background:#0c1016;color:#566171;text-align:right;padding:17px 10px;
  white-space:pre;overflow:hidden;line-height:1.55;font:14px ui-monospace,SFMono-Regular,Menlo,monospace
}
.code{
  flex:1;min-width:0;resize:none;border:0;outline:0;background:#090c11;color:#eef2f7;padding:17px;
  line-height:1.55;font:14px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;tab-size:2
}
.notes-layout{display:grid;grid-template-columns:285px minmax(0,1fr);gap:14px;min-height:calc(100vh - 185px)}
.notes-list,.note-editor{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.notes-list{overflow:auto}.note-row{padding:14px;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s}
.note-row:hover,.note-row.active{background:var(--surface-2)}.note-row b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-row small{display:block;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-editor{display:flex;flex-direction:column;padding:17px}.note-editor textarea{flex:1;min-height:280px;resize:none;margin-top:10px;line-height:1.6}
.toast{
  position:fixed;right:18px;bottom:18px;z-index:300;background:#171d27;border:1px solid #344050;
  border-radius:12px;padding:12px 15px;box-shadow:var(--shadow);opacity:0;transform:translateY(15px);pointer-events:none;transition:.22s
}
.toast.show{opacity:1;transform:none}
.progress{position:fixed;left:0;right:0;bottom:0;height:3px;background:transparent;z-index:400}
.progress i{display:block;width:0;height:100%;background:var(--accent);transition:.15s}

/* Font Customization Styles */
.style-handwritten { font-family: "Comic Sans MS", "Segoe Print", cursive !important; }
.style-gothic { font-family: "Old English Text MT", Georgia, serif !important; }
.style-classic { font-family: Palatino, Georgia, serif !important; }
.style-mono { font-family: monospace !important; }
.style-terminal { font-family: "Courier New", monospace !important; background:#000 !important; color:#0f0 !important; }
.style-typewriter { font-family: "Courier", monospace !important; }

@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(-3px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}

@media(max-width:700px){
  .app{flex-direction:column}
  .sidebar{width:100%;flex:0 0 auto;flex-direction:row;align-items:center;justify-content:space-between;padding:10px 15px}
  .sidebar-bottom{flex-direction:row;margin-top:0}
  .brand-text,.nav-text{display:none}
  .topbar{height:60px;padding:0 15px}
  .page{padding:15px}
  .notes-layout{grid-template-columns:1fr;grid-template-rows:180px 1fr}
}
</style>
<!-- JSZip library for compression and decompression -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>

<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24"><path d="M4 7.5h6l1.7 2H20v9H4z"/><path d="M4 7.5V5.5h6l1.5 2"/></svg>
      </div>
      <span class="brand-text">File Manager</span>
    </div>
    <button class="nav active" data-view="files"><svg viewBox="0 0 24 24"><path d="M4 7.5h6l1.7 2H20v9H4z"/><path d="M4 7.5V5.5h6l1.5 2"/></svg><span class="nav-text">My Files</span></button>
    <button class="nav" data-view="notes"><svg viewBox="0 0 24 24"><path d="M6 4h12v16H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg><span class="nav-text">Notes</span></button>
    <button class="nav" data-view="trash"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg><span class="nav-text">Trash</span></button>
    
    <div class="sidebar-bottom">
      <button class="nav" id="importFilesBtn"><svg viewBox="0 0 24 24"><path d="M12 4v11M8 11l4 4 4-4"/><path d="M5 19h14"/></svg><span class="nav-text">Import Files</span></button>
      <button class="nav" id="importFolderBtn"><svg viewBox="0 0 24 24"><path d="M4 7.5h6l1.7 2H20v9H4z"/><path d="M12 12v5M9.5 14.5h5"/></svg><span class="nav-text">Import Folder</span></button>
      <input id="filePicker" type="file" multiple hidden>
      <input id="folderPicker" type="file" webkitdirectory directory multiple hidden>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="breadcrumbs" id="breadcrumbs"></div>
      <input class="search" id="search" autocomplete="off" placeholder="Search files...">
    </header>
    <section class="page" id="page"></section>
  </main>
</div>

<div class="menu" id="contextMenu"></div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<div class="progress"><i id="progressBar"></i></div>

<div class="editor" id="editor">
  <div class="editor-bar">
    <button class="btn ghost" id="editorClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>Close</button>
    <div class="editor-title"><input id="editorName" aria-label="File name"></div>
    <select class="btn" id="editorStyle">
      <option value="normal">Normal</option>
      <option value="handwritten">Handwritten</option>
      <option value="gothic">Gothic</option>
      <option value="classic">Classic</option>
      <option value="mono">Monospace</option>
      <option value="terminal">Terminal</option>
      <option value="typewriter">Typewriter</option>
    </select>
    <button class="btn primary" id="editorSave"><svg viewBox="0 0 24 24"><path d="M5 4h12l2 2v14H5z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/></svg>Save</button>
  </div>
  <div class="editor-body">
    <div class="line-numbers" id="lineNumbers">1</div>
    <textarea class="code" id="code" spellcheck="false"></textarea>
  </div>
</div>

<script>
const DB_NAME = "FM_FULL_SYSTEM_DB";
const DB_VERSION = 1;

let db = null;
let view = "files";
let currentFolder = null;
let editorId = null;
let activeNoteId = null;

const $ = (q) => document.querySelector(q);
const page = $("#page");
const search = $("#search");
const breadcrumbs = $("#breadcrumbs");
const modalBackdrop = $("#modalBackdrop");
const contextMenu = $("#contextMenu");

const ICONS = {
  folder: `<svg viewBox="0 0 24 24"><path d="M3.5 7.5h6l1.7 2H20v9h-16.5z"/><path d="M3.5 7.5V5.5h6l1.5 2"/></svg>`,
  file: `<svg viewBox="0 0 24 24"><path d="M6 3.5h8l4 4V20.5H6z"/><path d="M14 3.5v5h4M9 13h6M9 16h6"/></svg>`,
  more: `<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>`,
  download: `<svg viewBox="0 0 24 24"><path d="M12 4v11M8 11l4 4 4-4"/><path d="M5 20h14"/></svg>`,
  edit: `<svg viewBox="0 0 24 24"><path d="M4 17.5V20h2.5L18 8.5 15.5 6z"/><path d="M14.5 7l2.5 2.5"/></svg>`,
  move: `<svg viewBox="0 0 24 24"><path d="M4 7h9M13 7l-3-3M13 7l-3 3M20 17h-9M11 17l3-3M11 17l3 3"/></svg>`,
  trash: `<svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg>`,
  zip: `<svg viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5z"/><path d="M15 4v5h4M12 7v2M10.5 11h3M12 14v6"/></svg>`,
  extract: `<svg viewBox="0 0 24 24"><path d="M12 4v11M8 11l4 4 4-4"/><path d="M5 20h14"/></svg>`,
  open: `<svg viewBox="0 0 24 24"><path d="M4 7.5h6l1.7 2H20v9H4z"/><path d="M4 7.5V5.5h6l1.5 2"/></svg>`,
  restore: `<svg viewBox="0 0 24 24"><path d="M5 8a8 8 0 1 1 1 9"/><path d="M5 4v4h4"/></svg>`
};

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function req(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function store(name, mode = "readonly") {
  return db.transaction(name, mode).objectStore(name);
}

function dbGet(name, id) { return req(store(name).get(id)); }
function dbAll(name) { return req(store(name).getAll()); }
function dbPut(name, value) { return req(store(name, "readwrite").put(value)); }
function dbDelete(name, id) { return req(store(name, "readwrite").delete(id)); }

function openDatabase() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = () => {
      const d = request.result;
      if (!d.objectStoreNames.contains("items")) d.createObjectStore("items", {keyPath:"id"});
      if (!d.objectStoreNames.contains("notes")) d.createObjectStore("notes", {keyPath:"id"});
      if (!d.objectStoreNames.contains("trash")) d.createObjectStore("trash", {keyPath:"id"});
    };
    request.onsuccess = () => { db = request.result; resolve(); };
    request.onerror = () => reject(request.error);
  });
}

function showToast(message) {
  const toast = $("#toast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove("show"), 2300);
}

function setProgress(value) {
  $("#progressBar").style.width = Math.max(0, Math.min(100, value)) + "%";
  if (value >= 100) setTimeout(() => $("#progressBar").style.width = "0%", 400);
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[char]));
}

function getExtension(name) {
  const parts = String(name).split(".");
  return parts.length > 1 ? parts.pop().toLowerCase() : "";
}

function extensionClass(name) {
  const e = getExtension(name);
  return ["js","ts","jsx","tsx"].includes(e) ? "js" :
    ["py"].includes(e) ? "py" :
    ["html","htm"].includes(e) ? "html" :
    ["css","scss"].includes(e) ? "css" :
    ["json"].includes(e) ? "json" :
    ["zip","rar","tar","gz"].includes(e) ? "zip" : "";
}

function fileBadge(name, type) {
  if (type === "folder") return `<div class="item-icon folder">${ICONS.folder}</div>`;
  const e = getExtension(name);
  const cls = extensionClass(name);
  const label = e ? e.toUpperCase().slice(0, 5) : "";
  return `<div class="item-icon ${cls}">${label || ICONS.file}</div>`;
}

function formatSize(bytes) {
  if (!bytes) return "0 B";
  const units = ["B","KB","MB","GB"];
  let n = bytes, i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return `${n.toFixed(i ? 1 : 0)} ${units[i]}`;
}

async function children(parentId, source = "items") {
  const all = await dbAll(source);
  return all.filter(item => (item.parent || null) === (parentId || null));
}

async function findChild(parent, name) {
  const items = await children(parent);
  return items.find(x => x.name === name);
}

async function makeFolder(name, parent) {
  const existing = await findChild(parent, name);
  if (existing && existing.type === "folder") return existing.id;
  const folder = {
    id: uid(), name, type: "folder", parent: parent || null,
    createdAt: Date.now(), modifiedAt: Date.now()
  };
  await dbPut("items", folder);
  return folder.id;
}

function closeModal() { modalBackdrop.classList.remove("show"); }
function openModal(title, body, actions) {
  $("#modal").innerHTML = `<h2>${title}</h2>${body}<div class="modal-actions">${actions}</div>`;
  modalBackdrop.classList.add("show");
}

function askText(title, label, value, callback) {
  openModal(
    title,
    `<div class="field"><label>${label}</label><input id="modalText" value="${escapeHTML(value)}"></div>`,
    `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="modalConfirm">Continue</button>`
  );
  const input = $("#modalText");
  $("#modalConfirm").onclick = () => {
    const v = input.value.trim();
    if (!v) return;
    closeModal();
    callback(v);
  };
  setTimeout(() => input.focus(), 30);
}

function confirmBox(title, message, callback, danger = true) {
  openModal(
    title,
    `<p>${escapeHTML(message)}</p>`,
    `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn ${danger ? "danger" : "primary"}" id="confirmButton">Confirm</button>`
  );
  $("#confirmButton").onclick = () => { closeModal(); callback(); };
}

function setActiveNav(viewName) {
  document.querySelectorAll(".nav[data-view]").forEach(button => {
    button.classList.toggle("active", button.dataset.view === viewName);
  });
}

function navigate(viewName) {
  view = viewName;
  setActiveNav(viewName);
  if (viewName === "files") renderFiles();
  if (viewName === "notes") renderNotes();
  if (viewName === "trash") renderTrash();
}

document.querySelectorAll(".nav[data-view]").forEach(button => {
  button.addEventListener("click", () => navigate(button.dataset.view));
});

search.addEventListener("input", () => {
  if (view === "files") drawFileGrid();
  if (view === "notes") drawNotesList();
  if (view === "trash") drawTrashGrid();
});

async function buildBreadcrumbs(folderId) {
  const pieces = [];
  let current = folderId ? await dbGet("items", folderId) : null;
  while (current) {
    pieces.unshift(current);
    current = current.parent ? await dbGet("items", current.parent) : null;
  }
  breadcrumbs.innerHTML = `
    <button class="crumb ${pieces.length ? "" : "current"}" onclick="goHome()">Home</button>
    ${pieces.map((item, index) => `
      <span>/</span>
      <button class="crumb ${index === pieces.length - 1 ? "current" : ""}" onclick="openFolder('${item.id}')">
        ${escapeHTML(item.name)}
      </button>
    `).join("")}
  `;
}

function goHome() { currentFolder = null; renderFiles(); }
async function openFolder(id) { currentFolder = id; renderFiles(); }

async function renderFiles() {
  view = "files";
  setActiveNav("files");
  search.placeholder = "Search files...";
  await buildBreadcrumbs(currentFolder);

  page.innerHTML = `
    <div class="hero">
      <div>
        <h1>${currentFolder ? "Folder View" : "My Files"}</h1>
        <div class="subtitle">Manage files and folders efficiently.</div>
      </div>
    </div>
    <div class="toolbar">
      <button class="btn primary" onclick="createFile()"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New File</button>
      <button class="btn" onclick="createFolder()">${ICONS.folder} New Folder</button>
      <button class="btn" onclick="compressCurrentFolder()">${ICONS.zip} Compress Folder</button>
    </div>
    <div class="grid" id="fileGrid"></div>
  `;
  await drawFileGrid();
}

async function drawFileGrid() {
  const grid = $("#fileGrid");
  if (!grid) return;
  let items = await children(currentFolder);
  const query = search.value.trim().toLowerCase();
  if (query) items = items.filter(item => item.name.toLowerCase().includes(query));

  items.sort((a,b) => a.type !== b.type ? (a.type === "folder" ? -1 : 1) : a.name.localeCompare(b.name));

  if (!items.length) {
    grid.innerHTML = `<div class="empty"><div><div style="font-size:18px;color:#dce2eb;font-weight:700;">No files here</div></div></div>`;
    return;
  }

  grid.innerHTML = items.map((item, index) => `
    <article class="item-card" style="animation-delay:${Math.min(index * 25, 250)}ms" onclick="openItem('${item.id}')">
      <button class="more" aria-label="More actions" onclick="event.stopPropagation();openItemMenu(event,'${item.id}')">${ICONS.more}</button>
      ${fileBadge(item.name, item.type)}
      <div class="item-name">${escapeHTML(item.name)}</div>
      <div class="item-meta">${item.type === "folder" ? "Folder" : `${formatSize(item.size || new Blob([item.content || ""]).size)}`}</div>
    </article>
  `).join("");
}

async function openItem(id) {
  const item = await dbGet("items", id);
  if (!item) return;
  if (item.type === "folder") { await openFolder(item.id); return; }
  openEditor(item);
}

function createFile() {
  askText("Create File", "File name", "untitled.txt", async name => {
    const item = {
      id: uid(), name, type: "file", parent: currentFolder || null,
      content: "", size: 0, style: "normal", createdAt: Date.now(), modifiedAt: Date.now()
    };
    await dbPut("items", item);
    await renderFiles();
    openEditor(item);
  });
}

function createFolder() {
  askText("Create Folder", "Folder name", "New Folder", async name => {
    await makeFolder(name, currentFolder);
    await renderFiles();
    showToast("Folder created");
  });
}

function menuButton(label, icon, action, danger = false) {
  const button = document.createElement("button");
  button.innerHTML = `${icon}${escapeHTML(label)}`;
  if (danger) button.classList.add("danger");
  button.onclick = () => { closeMenu(); action(); };
  contextMenu.appendChild(button);
}

async function openItemMenu(event, id) {
  const item = await dbGet("items", id);
  if (!item) return;
  contextMenu.innerHTML = "";
  menuButton("Open", ICONS.open, () => openItem(id));
  if (item.type === "file") menuButton("Download", ICONS.download, () => downloadFile(id));
  if (getExtension(item.name) === "zip") menuButton("Extract ZIP", ICONS.extract, () => extractZip(id));
  menuButton("Move", ICONS.move, () => moveItemDialog(id));
  menuButton("Rename", ICONS.edit, () => renameItem(id));
  menuButton("Delete", ICONS.trash, () => sendToTrash(id), true);
  positionMenu(event);
}

function positionMenu(event) {
  contextMenu.style.display = "block";
  contextMenu.style.left = Math.min(event.clientX, innerWidth - 220) + "px";
  contextMenu.style.top = Math.min(event.clientY, innerHeight - 200) + "px";
}

function closeMenu() { contextMenu.style.display = "none"; }

document.addEventListener("click", event => {
  if (!event.target.closest("#contextMenu") && !event.target.closest(".more")) closeMenu();
});

async function renameItem(id) {
  const item = await dbGet("items", id);
  askText("Rename", "New name", item.name, async name => {
    item.name = name;
    item.modifiedAt = Date.now();
    await dbPut("items", item);
    renderFiles();
    showToast("Renamed successfully");
  });
}

async function moveItemDialog(id) {
  const item = await dbGet("items", id);
  const all = await dbAll("items");
  const folders = all.filter(x => x.type === "folder" && x.id !== id);
  
  const options = `<option value="">/ (Root)</option>` + 
    folders.map(f => `<option value="${f.id}" ${f.id === item.parent ? "selected" : ""}>/${escapeHTML(f.name)}</option>`).join("");

  openModal(
    "Move Item",
    `<div class="field"><label>Select Destination Folder</label><select id="moveDest">${options}</select></div>`,
    `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="confirmMove">Move</button>`
  );

  $("#confirmMove").onclick = async () => {
    const dest = $("#moveDest").value || null;
    item.parent = dest;
    item.modifiedAt = Date.now();
    await dbPut("items", item);
    closeModal();
    renderFiles();
    showToast("Moved successfully");
  };
}

async function sendToTrash(id) {
  const item = await dbGet("items", id);
  if (!item) return;
  confirmBox("Move to Trash?", `"${item.name}" will be moved to Trash.`, async () => {
    item.deletedAt = Date.now();
    await dbPut("trash", item);
    await dbDelete("items", id);
    renderFiles();
    showToast("Moved to Trash");
  });
}

async function downloadFile(id) {
  const item = await dbGet("items", id);
  if (!item) return;
  const blob = new Blob([item.content || ""], {type: "text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = item.name;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* Import Files & Folders */
$("#importFilesBtn").onclick = () => $("#filePicker").click();
$("#importFolderBtn").onclick = () => $("#folderPicker").click();

$("#filePicker").onchange = async (e) => {
  const files = Array.from(e.target.files);
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    const text = await f.text();
    await dbPut("items", {
      id: uid(), name: f.name, type: "file", parent: currentFolder || null,
      content: text, size: f.size, createdAt: Date.now(), modifiedAt: Date.now()
    });
    setProgress(((i + 1) / files.length) * 100);
  }
  renderFiles();
  showToast("Files imported");
};

$("#folderPicker").onchange = async (e) => {
  const files = Array.from(e.target.files);
  const folderMap = {};
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    const parts = f.webkitRelativePath.split("/");
    let parent = currentFolder;

    for (let p = 0; p < parts.length - 1; p++) {
      const pathKey = parts.slice(0, p + 1).join("/");
      if (!folderMap[pathKey]) {
        folderMap[pathKey] = await makeFolder(parts[p], parent);
      }
      parent = folderMap[pathKey];
    }

    const text = await f.text();
    await dbPut("items", {
      id: uid(), name: f.name, type: "file", parent: parent,
      content: text, size: f.size, createdAt: Date.now(), modifiedAt: Date.now()
    });
    setProgress(((i + 1) / files.length) * 100);
  }
  renderFiles();
  showToast("Folder structure imported");
};

/* ZIP Compression & Extraction */
async function compressCurrentFolder() {
  if (typeof JSZip === "undefined") { showToast("Zip library loading..."); return; }
  const zip = new JSZip();
  const items = await children(currentFolder);
  if (!items.length) { showToast("Folder is empty"); return; }

  for (const item of items) {
    if (item.type === "file") zip.file(item.name, item.content || "");
  }

  const content = await zip.generateAsync({type: "blob"});
  const reader = new FileReader();
  reader.onload = async () => {
    await dbPut("items", {
      id: uid(), name: "archive.zip", type: "file", parent: currentFolder || null,
      content: reader.result, size: content.size, createdAt: Date.now(), modifiedAt: Date.now()
    });
    renderFiles();
    showToast("Compressed to archive.zip");
  };
  reader.readAsText(content);
}

async function extractZip(id) {
  const item = await dbGet("items", id);
  if (!item || typeof JSZip === "undefined") return;
  const zip = await JSZip.loadAsync(item.content);
  const targetFolder = await makeFolder(item.name.replace(".zip", ""), currentFolder);

  for (const [filename, fileObj] of Object.entries(zip.files)) {
    if (!fileObj.dir) {
      const text = await fileObj.async("string");
      await dbPut("items", {
        id: uid(), name: filename.split("/").pop(), type: "file", parent: targetFolder,
        content: text, size: text.length, createdAt: Date.now(), modifiedAt: Date.now()
      });
    }
  }
  renderFiles();
  showToast("Extracted successfully");
}

/* Editor Implementation */
function openEditor(item) {
  editorId = item.id;
  $("#editorName").value = item.name;
  $("#code").value = item.content || "";
  $("#editorStyle").value = item.style || "normal";
  applyCodeStyle(item.style || "normal");
  $("#editor").classList.add("show");
  updateLineNumbers();
}

function applyCodeStyle(styleClass) {
  const code = $("#code");
  code.className = "code " + (styleClass !== "normal" ? `style-${styleClass}` : "");
}

$("#editorStyle").addEventListener("change", (e) => applyCodeStyle(e.target.value));

function closeEditor() { $("#editor").classList.remove("show"); editorId = null; }
function updateLineNumbers() {
  const lines = $("#code").value.split("\n").length;
  $("#lineNumbers").textContent = Array.from({length: lines}, (_, i) => i + 1).join("\n");
}

$("#editorClose").onclick = closeEditor;
$("#code").addEventListener("input", updateLineNumbers);

$("#editorSave").onclick = async () => {
  if (!editorId) return;
  const item = await dbGet("items", editorId);
  if (!item) return;
  item.name = $("#editorName").value.trim() || item.name;
  item.content = $("#code").value;
  item.style = $("#editorStyle").value;
  item.modifiedAt = Date.now();
  await dbPut("items", item);
  closeEditor();
  renderFiles();
  showToast("Saved");
};

/* Notes Section */
async function renderNotes() {
  view = "notes";
  setActiveNav("notes");
  search.placeholder = "Search notes...";
  breadcrumbs.innerHTML = `<span class="crumb current">Notes</span>`;

  page.innerHTML = `
    <div class="hero">
      <div>
        <h1>Notes Studio</h1>
        <div class="subtitle">Quick personal notebook.</div>
      </div>
      <button class="btn primary" onclick="createNewNote()"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New Note</button>
    </div>
    <div class="notes-layout">
      <div class="notes-list" id="notesList"></div>
      <div class="note-editor" id="noteEditorArea">
        <div class="empty">Select or create a note to start writing.</div>
      </div>
    </div>
  `;
  await drawNotesList();
}

async function drawNotesList() {
  const container = $("#notesList");
  if (!container) return;
  let notes = await dbAll("notes");
  const query = search.value.trim().toLowerCase();
  if (query) notes = notes.filter(n => n.title.toLowerCase().includes(query) || n.content.toLowerCase().includes(query));

  notes.sort((a,b) => b.modifiedAt - a.modifiedAt);

  if (!notes.length) {
    container.innerHTML = `<div class="empty" style="min-height:100px;border:0;">No notes</div>`;
    return;
  }

  container.innerHTML = notes.map(n => `
    <div class="note-row ${n.id === activeNoteId ? "active" : ""}" onclick="selectNote('${n.id}')">
      <b>${escapeHTML(n.title || "Untitled Note")}</b>
      <small>${escapeHTML(n.content.slice(0,40) || "Empty note...")}</small>
    </div>
  `).join("");
}

async function createNewNote() {
  const note = {
    id: uid(), title: "New Note", content: "", style: "normal", modifiedAt: Date.now()
  };
  await dbPut("notes", note);
  activeNoteId = note.id;
  await drawNotesList();
  selectNote(note.id);
}

async function selectNote(id) {
  activeNoteId = id;
  const note = await dbGet("notes", id);
  if (!note) return;
  drawNotesList();

  const area = $("#noteEditorArea");
  area.innerHTML = `
    <div class="field"><input id="noteTitle" value="${escapeHTML(note.title)}" placeholder="Note Title"></div>
    <div class="field" style="margin:0;">
      <select id="noteStyle" class="btn" style="width:auto;margin-bottom:10px;">
        <option value="normal" ${note.style==='normal'?'selected':''}>Normal Font</option>
        <option value="handwritten" ${note.style==='handwritten'?'selected':''}>Handwritten</option>
        <option value="gothic" ${note.style==='gothic'?'selected':''}>Gothic</option>
        <option value="classic" ${note.style==='classic'?'selected':''}>Classic</option>
        <option value="mono" ${note.style==='mono'?'selected':''}>Monospace</option>
      </select>
    </div>
    <textarea id="noteContent" class="${note.style !== 'normal' ? 'style-'+note.style : ''}" placeholder="Write your thoughts here...">${escapeHTML(note.content)}</textarea>
    <div class="modal-actions">
      <button class="btn danger" onclick="deleteNote('${note.id}')">${ICONS.trash} Delete</button>
      <button class="btn primary" onclick="saveNote('${note.id}')">Save Changes</button>
    </div>
  `;

  $("#noteStyle").onchange = (e) => {
    $("#noteContent").className = e.target.value !== 'normal' ? 'style-' + e.target.value : '';
  };
}

async function saveNote(id) {
  const note = await dbGet("notes", id);
  if (!note) return;
  note.title = $("#noteTitle").value.trim() || "Untitled Note";
  note.content = $("#noteContent").value;
  note.style = $("#noteStyle").value;
  note.modifiedAt = Date.now();
  await dbPut("notes", note);
  drawNotesList();
  showToast("Note saved");
}

async function deleteNote(id) {
  confirmBox("Delete Note?", "Are you sure you want to delete this note?", async () => {
    await dbDelete("notes", id);
    activeNoteId = null;
    renderNotes();
    showToast("Note deleted");
  });
}

/* Trash Section */
async function renderTrash() {
  view = "trash";
  setActiveNav("trash");
  breadcrumbs.innerHTML = `<span class="crumb current">Trash</span>`;
  page.innerHTML = `
    <div class="hero">
      <div>
        <h1>Trash Bin</h1>
        <div class="subtitle">Items stored here can be restored or deleted permanently.</div>
      </div>
      <button class="btn danger" onclick="emptyTrash()">Empty Trash</button>
    </div>
    <div class="grid" id="trashGrid"></div>
  `;
  await drawTrashGrid();
}

async function drawTrashGrid() {
  const grid = $("#trashGrid");
  if (!grid) return;
  let items = await dbAll("trash");
  const query = search.value.trim().toLowerCase();
  if (query) items = items.filter(i => i.name.toLowerCase().includes(query));

  if (!items.length) {
    grid.innerHTML = `<div class="empty">Trash is empty</div>`;
    return;
  }

  grid.innerHTML = items.map(item => `
    <article class="item-card">
      ${fileBadge(item.name, item.type)}
      <div class="item-name">${escapeHTML(item.name)}</div>
      <div class="modal-actions" style="margin-top:15px;justify-content:flex-start;">
        <button class="btn" onclick="restoreTrash('${item.id}')">${ICONS.restore} Restore</button>
        <button class="btn danger" onclick="permanentlyDelete('${item.id}')">Delete</button>
      </div>
    </article>
  `).join("");
}

async function restoreTrash(id) {
  const item = await dbGet("trash", id);
  if (!item) return;
  delete item.deletedAt;
  await dbPut("items", item);
  await dbDelete("trash", id);
  renderTrash();
  showToast("Item restored");
}

async function permanentlyDelete(id) {
  await dbDelete("trash", id);
  renderTrash();
  showToast("Permanently deleted");
}

async function emptyTrash() {
  confirmBox("Empty Trash?", "This action cannot be undone.", async () => {
    const items = await dbAll("trash");
    for (const item of items) await dbDelete("trash", item.id);
    renderTrash();
    showToast("Trash emptied");
  });
}

async function boot() {
  try {
    await openDatabase();
    await renderFiles();
  } catch (error) {
    console.error("Boot error:", error);
  }
}

boot();
</script>
