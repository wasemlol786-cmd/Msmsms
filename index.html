<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0d12">
<title>File Manager</title>
<style>
:root{
  --bg:#080a0f;--surface:#0e1219;--surface-2:#131923;--surface-3:#181f2b;
  --line:#242d3a;--text:#f4f7fb;--muted:#8d98aa;--accent:#7c5cff;
  --accent-2:#a48cff;--danger:#f05272;--success:#43d19e;
  --radius:16px;--shadow:0 24px 70px rgba(0,0,0,.42);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{
  background:
    radial-gradient(circle at 12% -10%,rgba(124,92,255,.20),transparent 34%),
    radial-gradient(circle at 90% 100%,rgba(55,130,255,.08),transparent 28%),var(--bg);
  color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow:hidden;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{height:100%;display:flex}
.sidebar{
  width:250px;flex:0 0 250px;border-right:1px solid var(--line);background:rgba(10,13,18,.82);
  backdrop-filter:blur(20px);padding:18px 13px;display:flex;flex-direction:column;gap:7px;z-index:20
}
.brand{display:flex;align-items:center;gap:11px;padding:11px 12px 25px;font-weight:800;font-size:18px;letter-spacing:-.02em}
.brand-mark{width:32px;height:32px;border:1px solid #3a3266;border-radius:10px;display:grid;place-items:center;color:#b8aaff;background:#17132a}
.nav{
  width:100%;display:flex;align-items:center;gap:12px;border:1px solid transparent;background:transparent;
  color:var(--muted);padding:11px 12px;border-radius:11px;text-align:left;transition:.2s
}
.nav:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav.active{background:linear-gradient(135deg,rgba(124,92,255,.18),rgba(124,92,255,.06));border-color:#30275a;color:#fff}
.sidebar-bottom{margin-top:auto}
.main{min-width:0;flex:1;display:flex;flex-direction:column}
.topbar{
  height:72px;flex:0 0 72px;border-bottom:1px solid var(--line);background:rgba(8,10,15,.68);
  backdrop-filter:blur(18px);display:flex;align-items:center;gap:12px;padding:0 22px;position:relative;z-index:10
}
.breadcrumbs{display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:auto;flex:1;color:var(--muted);min-width:0}
.crumb{border:0;background:none;color:inherit;padding:5px 4px;border-radius:7px}
.crumb:hover{color:#fff;background:rgba(255,255,255,.04)}
.crumb.current{color:#fff;font-weight:700}
.search{
  width:230px;flex:0 0 230px;background:var(--surface);border:1px solid var(--line);color:#fff;
  outline:none;border-radius:11px;padding:10px 12px;transition:.2s
}
.search:focus{border-color:#50427f;box-shadow:0 0 0 3px rgba(124,92,255,.1)}
.page{flex:1;overflow:auto;padding:25px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:22px}
h1{font-size:29px;line-height:1;margin:0 0 8px;letter-spacing:-.035em}
.subtitle{color:var(--muted);font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);
  background:var(--surface-2);color:#e9edf4;padding:10px 13px;border-radius:11px;transition:.18s
}
.btn:hover{transform:translateY(-1px);border-color:#3d4859;background:var(--surface-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#896cff;border-color:#896cff}
.btn.danger{background:rgba(240,82,114,.09);border-color:rgba(240,82,114,.28);color:#ff9eb2}
.btn.ghost{background:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px}
.item-card{
  position:relative;min-height:170px;border:1px solid var(--line);border-radius:17px;
  background:linear-gradient(145deg,rgba(20,26,36,.98),rgba(13,17,24,.98));
  padding:18px;transition:.22s;animation:rise .3s ease both;overflow:hidden
}
.item-card:hover{transform:translateY(-4px);border-color:#3a4555;box-shadow:0 15px 35px rgba(0,0,0,.18)}
.item-card.selected{border-color:#6652bb;box-shadow:0 0 0 2px rgba(124,92,255,.12)}
.item-icon{
  width:48px;height:48px;border-radius:13px;background:#191f2a;border:1px solid #2b3442;
  display:grid;place-items:center;font-size:11px;font-weight:800;letter-spacing:-.02em;color:#b8c1cf;margin-bottom:25px
}
.item-icon.folder{color:#c9bbff;background:#211c34;border-color:#3a3260}
.item-icon.js{color:#ffe76a;background:#27261c}.item-icon.py{color:#70c8ff;background:#17242c}
.item-icon.html{color:#ff8d74;background:#2a1d1a}.item-icon.css{color:#71a8ff;background:#182031}
.item-icon.json{color:#b8c1cf}.item-icon.zip{color:#d8b4ff;background:#241b2e}
.item-name{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-meta{color:var(--muted);font-size:12px;margin-top:6px}
.more{
  position:absolute;right:10px;top:10px;border:0;background:transparent;color:#8d98aa;width:34px;height:34px;
  border-radius:9px;display:grid;place-items:center
}
.more:hover{background:rgba(255,255,255,.06);color:#fff}
.empty{
  border:1px dashed #2c3542;border-radius:16px;min-height:190px;display:grid;place-items:center;
  color:var(--muted);text-align:center;padding:30px
}
.menu{
  position:fixed;z-index:100;min-width:205px;padding:6px;border:1px solid #343e4d;background:#151b24;
  border-radius:13px;box-shadow:var(--shadow);animation:pop .14s ease
}
.menu button{
  width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#dce2eb;
  padding:10px;border-radius:9px;text-align:left
}
.menu button:hover{background:rgba(255,255,255,.06);color:#fff}
.menu button.danger{color:#ff9eb2}
.menu-sep{height:1px;background:var(--line);margin:5px 3px}
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(9px);display:none;
  align-items:center;justify-content:center;z-index:200;padding:20px
}
.modal-backdrop.show{display:flex;animation:fade .15s ease}
.modal{
  width:min(540px,100%);background:#151a23;border:1px solid #323c4a;border-radius:19px;
  box-shadow:var(--shadow);padding:22px;animation:modalIn .18s ease
}
.modal h2{margin:0 0 7px;font-size:20px}.modal p{color:var(--muted);line-height:1.55;margin:0 0 15px}
.field{margin:13px 0}.field label{display:block;color:#9ca6b5;font-size:12px;margin:0 0 7px}
.field input,.field textarea,.field select{
  width:100%;border:1px solid var(--line);outline:none;background:#0d1118;color:#fff;border-radius:11px;padding:11px 12px
}
.field textarea{min-height:150px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#55478b}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.editor{
  position:fixed;inset:0;background:#080a0e;z-index:150;display:none;flex-direction:column
}
.editor.show{display:flex;animation:fade .15s ease}
.editor-bar{height:65px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:10px 14px}
.editor-title{flex:1;min-width:0}.editor-title input{width:100%;background:transparent;border:0;outline:0;color:#fff;font-weight:750;font-size:15px}
.editor-body{display:flex;flex:1;min-height:0}
.line-numbers{
  width:58px;flex:0 0 58px;background:#0c1016;color:#566171;text-align:right;padding:17px 10px;
  white-space:pre;overflow:hidden;line-height:1.55;font:14px ui-monospace,SFMono-Regular,Menlo,monospace
}
.code{
  flex:1;min-width:0;resize:none;border:0;outline:0;background:#090c11;color:#eef2f7;padding:17px;
  line-height:1.55;font:14px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;tab-size:2
}
.notes-layout{display:grid;grid-template-columns:285px minmax(0,1fr);gap:14px;min-height:calc(100vh - 185px)}
.notes-list,.note-editor{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.notes-list{overflow:auto}.note-row{padding:14px;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s}
.note-row:hover,.note-row.active{background:var(--surface-2)}.note-row b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-row small{display:block;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-editor{display:flex;flex-direction:column;padding:17px}.note-editor textarea{flex:1;min-height:280px;resize:none;margin-top:10px;line-height:1.6}
.trash-card{border-color:#352633}
.toast{
  position:fixed;right:18px;bottom:18px;z-index:300;background:#171d27;border:1px solid #344050;
  border-radius:12px;padding:12px 15px;box-shadow:var(--shadow);opacity:0;transform:translateY(15px);pointer-events:none;transition:.22s
}
.toast.show{opacity:1;transform:none}
.progress{position:fixed;left:0;right:0;bottom:0;height:3px;background:transparent;z-index:400}
.progress i{display:block;width:0;height:100%;background:var(--accent);transition:.15s}
.hidden{display:none!important}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(-3px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
@media(max-width:800px){
  .sidebar{width:70px;flex-basis:70px;padding:12px 8px}.brand-text,.nav-text{display:none}.brand{justify-content:center;padding:10px 4px 22px}
  .nav{justify-content:center;padding:12px 8px}.topbar{padding:0 13px}.search{width:150px;flex-basis:150px}.page{padding:18px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}.notes-layout{grid-template-columns:1fr;grid-template-rows:180px minmax(400px,1fr)}
}
@media(max-width:520px){
  .topbar{height:62px;flex-basis:62px}.search{width:120px;flex-basis:120px}.hero{align-items:flex-start;flex-direction:column}
  h1{font-size:25px}.grid{grid-template-columns:1fr 1fr;gap:9px}.item-card{min-height:145px;padding:14px}.item-icon{margin-bottom:20px}
  .editor-bar{height:auto;min-height:62px;flex-wrap:wrap}.editor-title{order:3;flex-basis:100%}
}
</style>

<style id="mobile-fix">
@media (max-width: 700px){
  *{box-sizing:border-box}
  html,body{width:100%;min-width:0;overflow-x:hidden}
  body{font-size:14px}
  .app,.shell,.layout,.main,.content,.workspace,.container{max-width:100%!important;width:100%!important}
  .sidebar{position:fixed!important;left:-290px!important;top:0!important;bottom:0!important;width:280px!important;z-index:1000!important;transition:left .25s ease}
  .sidebar.open{left:0!important}
  .topbar,.header{padding:12px 14px!important;gap:8px!important}
  .main{margin-left:0!important;padding:12px!important}
  .toolbar{flex-wrap:wrap!important;gap:7px!important}
  button,.btn{min-height:42px}
  .file-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}
  .file-card,.folder-card,.item-card{min-width:0!important;width:100%!important;padding:12px!important}
  .file-card .name,.folder-card .name,.item-card .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .editor,.editor-wrap,.code-editor{width:100%!important;min-width:0!important}
  textarea,.editor textarea{font-size:14px!important;line-height:1.55!important}
  .modal,.dialog{width:calc(100vw - 24px)!important;max-width:none!important;margin:12px!important}
  .breadcrumb{overflow-x:auto;white-space:nowrap;max-width:100%}
  .notes-grid{grid-template-columns:1fr!important}
  .empty{padding:35px 15px!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24"><path d="M4 7.5h6l1.7 2H20v9H4z"/><path d="M4 7.5V5.5h6l1.5 2"/></svg>
      </div>
      <span class="brand-text">File Manager</span>
    </div>
    <button class="nav active" data-view="files"><svg viewBox="0 0 24 24"><path d="M4 7.5h6l1.7 2H20v9H4z"/><path d="M4 7.5V5.5h6l1.5 2"/></svg><span class="nav-text">My Files</span></button>
    <button class="nav" data-view="notes"><svg viewBox="0 0 24 24"><path d="M6 4h12v16H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg><span class="nav-text">Notes</span></button>
    <button class="nav" data-view="trash"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg><span class="nav-text">Trash</span></button>
    <div class="sidebar-bottom">
      <button class="nav" id="importFilesBtn"><svg viewBox="0 0 24 24"><path d="M12 4v11M8 11l4 4 4-4"/><path d="M5 19h14"/></svg><span class="nav-text">Import Files</span></button>
      <button class="nav" id="importFolderBtn"><svg viewBox="0 0 24 24"><path d="M4 7.5h6l1.7 2H20v9H4z"/><path d="M12 12v5M9.5 14.5h5"/></svg><span class="nav-text">Import Folder</span></button>
      <input id="filePicker" type="file" multiple hidden>
      <input id="folderPicker" type="file" webkitdirectory directory multiple hidden>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="breadcrumbs" id="breadcrumbs"></div>
      <input class="search" id="search" autocomplete="off" placeholder="Search files...">
    </header>

  </main>
</div>

<div class="menu" id="contextMenu"></div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<div class="progress"><i id="progressBar"></i></div>

<div class="editor" id="editor">
  <div class="editor-bar">
    <button class="btn ghost" id="editorClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>Close</button>
    <div class="editor-title"><input id="editorName" aria-label="File name"></div>
    <select class="btn" id="editorStyle">
      <option value="normal">Normal</option>
      <option value="serif">Serif</option>
      <option value="wide">Wide</option>
      <option value="mono">Monospace</option>
    </select>
    <button class="btn primary" id="editorSave"><svg viewBox="0 0 24 24"><path d="M5 4h12l2 2v14H5z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/></svg>Save</button>
  </div>
  <div class="editor-body">
    <div class="line-numbers" id="lineNumbers">1</div>
    <textarea class="code" id="code" spellcheck="false"></textarea>
  </div>
</div>

<script>
/* =========================================================
   FILE MANAGER
   Single-file application.
   Storage: IndexedDB.
   ZIP: native ZIP reader/writer (STORE method).
   ========================================================= */

const DB_NAME = "FM_SINGLE_FILE_DB";
const DB_VERSION = 2;

let db = null;
let view = "files";
let currentFolder = null;
let editorId = null;
let currentNote = null;
let menuOpen = false;

const $ = (q) => document.querySelector(q);
const page = $("#page");
const search = $("#search");
const breadcrumbs = $("#breadcrumbs");
const modalBackdrop = $("#modalBackdrop");
const contextMenu = $("#contextMenu");

const ICONS = {
  folder: `<svg viewBox="0 0 24 24"><path d="M3.5 7.5h6l1.7 2H20v9h-16.5z"/><path d="M3.5 7.5V5.5h6l1.5 2"/></svg>`,
  file: `<svg viewBox="0 0 24 24"><path d="M6 3.5h8l4 4V20.5H6z"/><path d="M14 3.5v5h4M9 13h6M9 16h6"/></svg>`,
  more: `<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>`,
  download: `<svg viewBox="0 0 24 24"><path d="M12 4v11M8 11l4 4 4-4"/><path d="M5 20h14"/></svg>`,
  edit: `<svg viewBox="0 0 24 24"><path d="M4 17.5V20h2.5L18 8.5 15.5 6z"/><path d="M14.5 7l2.5 2.5"/></svg>`,
  move: `<svg viewBox="0 0 24 24"><path d="M4 7h9M13 7l-3-3M13 7l-3 3M20 17h-9M11 17l3-3M11 17l3 3"/></svg>`,
  trash: `<svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg>`,
  zip: `<svg viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5z"/><path d="M15 4v5h4M12 7v2M10.5 11h3M12 14v6"/></svg>`,
  extract: `<svg viewBox="0 0 24 24"><path d="M12 4v11M8 11l4 4 4-4"/><path d="M5 20h14"/></svg>`,
  open: `<svg viewBox="0 0 24 24"><path d="M4 7.5h6l1.7 2H20v9H4z"/><path d="M4 7.5V5.5h6l1.5 2"/></svg>`,
  restore: `<svg viewBox="0 0 24 24"><path d="M5 8a8 8 0 1 1 1 9"/><path d="M5 4v4h4"/></svg>`
};

function uid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function req(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function store(name, mode = "readonly") {
  return db.transaction(name, mode).objectStore(name);
}

function dbGet(name, id) { return req(store(name).get(id)); }
function dbAll(name) { return req(store(name).getAll()); }
function dbPut(name, value) { return req(store(name, "readwrite").put(value)); }
function dbDelete(name, id) { return req(store(name, "readwrite").delete(id)); }

function openDatabase() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);

    request.onupgradeneeded = () => {
      const d = request.result;
      if (!d.objectStoreNames.contains("items")) d.createObjectStore("items", {keyPath:"id"});
      if (!d.objectStoreNames.contains("notes")) d.createObjectStore("notes", {keyPath:"id"});
      if (!d.objectStoreNames.contains("trash")) d.createObjectStore("trash", {keyPath:"id"});
    };

    request.onsuccess = () => {
      db = request.result;
      resolve();
    };

    request.onerror = () => reject(request.error);
  });
}

function showToast(message) {
  const toast = $("#toast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove("show"), 2300);
}

function setProgress(value) {
  $("#progressBar").style.width = Math.max(0, Math.min(100, value)) + "%";
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[char]));
}

function getExtension(name) {
  const parts = String(name).split(".");
  return parts.length > 1 ? parts.pop().toLowerCase() : "";
}

function extensionClass(name) {
  const e = getExtension(name);
  return ["js","ts","jsx","tsx"].includes(e) ? "js" :
    ["py"].includes(e) ? "py" :
    ["html","htm"].includes(e) ? "html" :
    ["css","scss","sass"].includes(e) ? "css" :
    ["json"].includes(e) ? "json" :
    ["zip"].includes(e) ? "zip" : "";
}

function fileBadge(name, type) {
  if (type === "folder") return `<div class="item-icon folder">${ICONS.folder}</div>`;
  const e = getExtension(name);
  const cls = extensionClass(name);
  const label = e ? e.toUpperCase().slice(0, 5) : "";
  return `<div class="item-icon ${cls}">${label || ICONS.file}</div>`;
}

function formatSize(bytes) {
  if (!bytes) return "Empty";
  const units = ["B","KB","MB","GB"];
  let n = bytes, i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return `${n.toFixed(i ? 1 : 0)} ${units[i]}`;
}

async function children(parentId, source = "items") {
  const all = await dbAll(source);
  return all.filter(item => (item.parent || null) === (parentId || null));
}

async function findChild(parent, name) {
  const items = await children(parent);
  return items.find(x => x.name === name);
}

async function makeFolder(name, parent, options = {}) {
  const existing = await findChild(parent, name);
  if (existing && existing.type === "folder") return existing.id;

  const folder = {
    id: uid(), name, type: "folder", parent: parent || null,
    createdAt: Date.now(), modifiedAt: Date.now(),
    originalParent: parent || null, ...options
  };
  await dbPut("items", folder);
  return folder.id;
}

/* ---------------- Modal system ---------------- */

function closeModal() {
  modalBackdrop.classList.remove("show");
}

function openModal(title, body, actions) {
  $("#modal").innerHTML = `
    <h2>${title}</h2>
    ${body}
    <div class="modal-actions">${actions}</div>
  `;
  modalBackdrop.classList.add("show");
}

function askText(title, label, value, callback) {
  openModal(
    title,
    `<div class="field"><label>${label}</label><input id="modalText" value="${escapeHTML(value)}"></div>`,
    `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="modalConfirm">Continue</button>`
  );
  const input = $("#modalText");
  $("#modalConfirm").onclick = () => {
    const v = input.value.trim();
    if (!v) return;
    closeModal();
    callback(v);
  };
  setTimeout(() => input.focus(), 30);
}

function confirmBox(title, message, callback, danger = true) {
  openModal(
    title,
    `<p>${escapeHTML(message)}</p>`,
    `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn ${danger ? "danger" : "primary"}" id="confirmButton">Confirm</button>`
  );
  $("#confirmButton").onclick = () => {
    closeModal();
    callback();
  };
}

/* ---------------- Navigation ---------------- */

function setActiveNav(viewName) {
  document.querySelectorAll(".nav[data-view]").forEach(button => {
    button.classList.toggle("active", button.dataset.view === viewName);
  });
}

function navigate(viewName) {
  view = viewName;
  currentFolder = viewName === "files" ? currentFolder : null;
  setActiveNav(viewName);
  if (viewName === "files") renderFiles();
  if (viewName === "notes") renderNotes();
  if (viewName === "trash") renderTrash();
}

document.querySelectorAll(".nav[data-view]").forEach(button => {
  button.addEventListener("click", () => navigate(button.dataset.view));
});

/* ---------------- Breadcrumbs ---------------- */

async function buildBreadcrumbs(folderId) {
  const pieces = [];
  let current = folderId ? await dbGet("items", folderId) : null;

  while (current) {
    pieces.unshift(current);
    current = current.parent ? await dbGet("items", current.parent) : null;
  }

  breadcrumbs.innerHTML = `
    <button class="crumb ${pieces.length ? "" : "current"}" onclick="goHome()">Home</button>
    ${pieces.map((item, index) => `
      <span>/</span>
      <button class="crumb ${index === pieces.length - 1 ? "current" : ""}" onclick="openFolder('${item.id}')">
        ${escapeHTML(item.name)}
      </button>
    `).join("")}
  `;
}

function goHome() {
  currentFolder = null;
  renderFiles();
}

async function openFolder(id) {
  currentFolder = id;
  renderFiles();
}

/* ---------------- File view ---------------- */

async function renderFiles() {
  view = "files";
  setActiveNav("files");
  search.placeholder = "Search files...";
  await buildBreadcrumbs(currentFolder);

  page.innerHTML = `
    <div class="hero">
      <div>
        <h1>${currentFolder ? "Folder" : "My Files"}</h1>
        <div class="subtitle">${currentFolder ? "Browse and manage everything inside this folder." : "Your private local workspace."}</div>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" onclick="createFile()">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New File
      </button>
      <button class="btn" onclick="createFolder()">
        ${ICONS.folder} New Folder
      </button>
      <button class="btn" onclick="document.getElementById('filePicker').click()">
        <svg viewBox="0 0 24 24"><path d="M12 4v11M8 11l4 4 4-4"/><path d="M5 20h14"/></svg>Import
      </button>
    </div>

    <div class="grid" id="fileGrid"></div>
  `;

  await drawFileGrid();
}

async function drawFileGrid() {
  const grid = $("#fileGrid");
  if (!grid) return;

  let items = await children(currentFolder);
  const query = search.value.trim().toLowerCase();

  if (query) items = items.filter(item => item.name.toLowerCase().includes(query));

  items.sort((a,b) => {
    if (a.type !== b.type) return a.type === "folder" ? -1 : 1;
    return a.name.localeCompare(b.name);
  });

  if (!items.length) {
    grid.innerHTML = `
      <div class="empty">
        <div>
          <div style="font-size:18px;color:#dce2eb;font-weight:700;margin-bottom:6px">Nothing here yet</div>
          <div>Create a file or folder, or import something from your device.</div>
        </div>
      </div>
    `;
    return;
  }

  grid.innerHTML = items.map((item, index) => `
    <article class="item-card" style="animation-delay:${Math.min(index * 25, 250)}ms" ondblclick="openItem('${item.id}')">
      <button class="more" aria-label="More actions" onclick="event.stopPropagation();openItemMenu(event,'${item.id}')">
        ${ICONS.more}
      </button>
      ${fileBadge(item.name, item.type)}
      <div class="item-name">${escapeHTML(item.name)}</div>
      <div class="item-meta">${item.type === "folder" ? "Folder" : `${formatSize(item.size || new Blob([item.content || ""]).size)} · ${getExtension(item.name) || "text"}`}</div>
    </article>
  `).join("");
}

async function openItem(id) {
  const item = await dbGet("items", id);
  if (!item) return;

  if (item.type === "folder") {
    await openFolder(item.id);
    return;
  }

  if (getExtension(item.name) === "zip") {
    await openZip(item);
    return;
  }

  openEditor(item);
}

function createFile() {
  askText("Create File", "File name", "untitled.txt", async name => {
    const item = {
      id: uid(), name, type: "file", parent: currentFolder || null,
      content: "", size: 0, style: "normal",
      createdAt: Date.now(), modifiedAt: Date.now()
    };
    await dbPut("items", item);
    await renderFiles();
    openEditor(item);
  });
}

function createFolder() {
  askText("Create Folder", "Folder name", "New Folder", async name => {
    await makeFolder(name, currentFolder);
    await renderFiles();
    showToast("Folder created");
  });
}

/* ---------------- Context menu ---------------- */

function menuButton(label, icon, action, danger = false) {
  const button = document.createElement("button");
  button.innerHTML = `${icon}${escapeHTML(label)}`;
  if (danger) button.classList.add("danger");
  button.onclick = () => {
    closeMenu();
    action();
  };
  contextMenu.appendChild(button);
}

function menuSeparator() {
  const div = document.createElement("div");
  div.className = "menu-sep";
  contextMenu.appendChild(div);
}

function openItemMenu(event, id) {
  const item = event.currentTarget ? event.currentTarget.closest(".item-card") : null;
  const itemId = id;
  dbGet("items", itemId).then(x => {
    contextMenu.innerHTML = "";
    menuButton("Open", ICONS.open, () => openItem(itemId));
    menuButton("Rename", ICONS.edit, () => renameItem(itemId));
    menuButton("Move", ICONS.move, () => moveItem(itemId));
    if (x.parent) menuButton("Move out to Home", ICONS.move, () => moveOut(itemId));
    menuButton("Download", ICONS.download, () => downloadItem(itemId));
    menuButton("Compress to ZIP", ICONS.zip, () => createZip([itemId]));
    if (x.type === "file" && getExtension(x.name) === "zip") {
      menuButton("Extract ZIP", ICONS.extract, () => extractZipToFolder(x));
    }
    menuSeparator();
    menuButton("Delete", ICONS.trash, () => sendToTrash(itemId), true);

    positionMenu(event);
  });
}

function positionMenu(event) {
  contextMenu.style.display = "block";
  const width = 210;
  const height = Math.min(contextMenu.scrollHeight || 300, innerHeight - 20);
  contextMenu.style.left = Math.min(event.clientX, innerWidth - width - 10) + "px";
  contextMenu.style.top = Math.min(event.clientY, innerHeight - height - 10) + "px";
}

function closeMenu() {
  contextMenu.style.display = "none";
}

document.addEventListener("click", event => {
  if (!event.target.closest("#contextMenu") && !event.target.closest(".more")) closeMenu();
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeMenu();
    closeModal();
    $("#editor").classList.remove("show");
  }
});

/* ---------------- Rename / move / delete ---------------- */

async function renameItem(id) {
  const item = await dbGet("items", id);
  askText("Rename", "New name", item.name, async name => {
    item.name = name;
    item.modifiedAt = Date.now();
    await dbPut("items", item);
    renderFiles();
    showToast("Renamed");
  });
}

async function moveOut(id) {
  const item = await dbGet("items", id);
  if (!item.parent) {
    showToast("This item is already in Home");
    return;
  }

  item.parent = null;
  item.modifiedAt = Date.now();
  await dbPut("items", item);
  renderFiles();
  showToast("Moved to Home");
}

async function moveItem(id) {
  const item = await dbGet("items", id);
  const all = await dbAll("items");
  const folders = all.filter(x => x.type === "folder" && x.id !== id && !isDescendantOf(x.id, id, all));

  openModal(
    "Move Item",
    `<div class="field"><label>Destination</label>
      <select id="moveDestination">
        <option value="">Home</option>
        ${folders.map(folder => `<option value="${folder.id}">${escapeHTML(folder.name)}</option>`).join("")}
      </select>
    </div>`,
    `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="moveConfirm">Move</button>`
  );

  $("#moveConfirm").onclick = async () => {
    item.parent = $("#moveDestination").value || null;
    item.modifiedAt = Date.now();
    await dbPut("items", item);
    closeModal();
    renderFiles();
    showToast("Moved");
  };
}

function isDescendantOf(candidateId, parentId, all) {
  let current = all.find(x => x.id === candidateId);
  const seen = new Set();

  while (current && current.parent) {
    if (seen.has(current.id)) return true;
    seen.add(current.id);
    if (current.parent === parentId) return true;
    current = all.find(x => x.id === current.parent);
  }
  return false;
}

async function sendToTrash(id) {
  const item = await dbGet("items", id);
  if (!item) return;

  confirmBox(
    "Move to Trash?",
    `"${item.name}" will be moved to Trash. You can restore it later.`,
    async () => {
      await moveTreeToTrash(id, item.parent || null);
      await renderFiles();
      showToast("Moved to Trash");
    }
  );
}

async function moveTreeToTrash(id, originalParent) {
  const item = await dbGet("items", id);
  if (!item) return;

  item.originalParent = originalParent;
  item.deletedAt = Date.now();

  await dbPut("trash", item);
  await dbDelete("items", id);

  if (item.type === "folder") {
    const descendants = await children(id);
    for (const child of descendants) {
      await moveTreeToTrash(child.id, id);
    }
  }
}

/* ---------------- Download ---------------- */

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement("a");
  anchor.href = url;
  anchor.download = filename;
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

async function downloadItem(id) {
  const item = await dbGet("items", id);
  if (!item) return;

  if (item.type === "file") {
    const blob = item.blob instanceof Blob
      ? item.blob
      : new Blob([item.content || ""], {type:"text/plain;charset=utf-8"});
    downloadBlob(blob, item.name);
    showToast("Download started");
    return;
  }

  await createZip([id], item.name + ".zip");
}

async function renderTrash() {
  view = "trash";
  setActiveNav("trash");
  search.placeholder = "Search trash...";
  breadcrumbs.innerHTML = `<button class="crumb current">Trash</button>`;

  const items = await dbAll("trash");

  const filtered = items.filter(x => !query || x.name.toLowerCase().includes(query));

  page.innerHTML = `
    <div class="hero">
      <div>
        <h1>Trash</h1>
        <div class="subtitle">Deleted items stay here until you permanently remove them.</div>
      </div>
      ${items.length ? `<button class="btn danger" onclick="emptyTrash()">${ICONS.trash} Empty Trash</button>` : ""}
    </div>
    <div class="grid" id="trashGrid"></div>
  `;

  const grid = $("#trashGrid");

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty"><div><div style="font-size:18px;color:#dce2eb;font-weight:700;margin-bottom:6px">Trash is empty</div><div>Deleted files and folders will appear here.</div></div></div>`;
    return;
  }

  grid.innerHTML = filtered.map((item,index) => `
    <article class="item-card trash-card" style="animation-delay:${Math.min(index*25,250)}ms">
      <button class="more" onclick="event.stopPropagation();openTrashMenu(event,'${item.id}')">${ICONS.more}</button>
      ${fileBadge(item.name,item.type)}
      <div class="item-name">${escapeHTML(item.name)}</div>
      <div class="item-meta">Deleted ${new Date(item.deletedAt || Date.now()).toLocaleString()}</div>

}

function openTrashMenu(event, id) {
  contextMenu.innerHTML = "";
  menuButton("Restore", ICONS.restore, () => restoreItem(id));
  menuButton("Delete permanently", ICONS.trash, () => permanentlyDelete(id), true);
  positionMenu(event);
}

async function restoreItem(id) {
  const item = await dbGet("trash", id);
  if (!item) return;

  const originalParent = item.originalParent;
  const parentExists = originalParent && await dbGet("items", originalParent);

  confirmBox(
    "Restore Item?",
    `"${item.name}" will be restored${parentExists ? " to its original folder" : " to Home"}.`,
    async () => {
      item.parent = parentExists ? originalParent : null;
      delete item.deletedAt;
      delete item.originalParent;
      await dbPut("items", item);
      await dbDelete("trash", id);

      if (item.type === "folder") {
        const trash = await dbAll("trash");
        const descendants = trash.filter(x => x.originalParent === id);
        for (const child of descendants) {
          child.parent = id;
          delete child.deletedAt;
          delete child.originalParent;
          await dbPut("items", child);
          await dbDelete("trash", child.id);
        }
      }

      renderTrash();
      showToast("Restored");
    },
    false
  );
}

async function permanentlyDelete(id) {
  const item = await dbGet("trash", id);
  if (!item) return;

  confirmBox(
    "Delete Permanently?",
    `"${item.name}" will be permanently deleted. This action cannot be undone.`,
    async () => {
      await dbDelete("trash", id);
      renderTrash();
      showToast("Permanently deleted");
    }
  );
}

async function emptyTrash() {
  const items = await dbAll("trash");
  if (!items.length) return;

  confirmBox(
    "Empty Trash?",
    `This will permanently delete ${items.length} item${items.length === 1 ? "" : "s"}. This action cannot be undone.`,
    async () => {
      for (const item of items) await dbDelete("trash", item.id);
      renderTrash();
      showToast("Trash emptied");
    }
  );
}

/* ---------------- Import ---------------- */

$("#importFilesBtn").onclick = () => $("#filePicker").click();
$("#importFolderBtn").onclick = () => $("#folderPicker").click();

$("#filePicker").addEventListener("change", async event => {
  const files = Array.from(event.target.files || []);
  await importFiles(files, currentFolder, false);
  event.target.value = "";
});

$("#folderPicker").addEventListener("change", async event => {
  const files = Array.from(event.target.files || []);
  await importFiles(files, currentFolder, true);
  event.target.value = "";
});

async function importFiles(files, destination, folderMode) {
  if (!files.length) return;

  setProgress(8);

  try {
    const folderCache = new Map();

    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      const relative = folderMode
        ? (file.webkitRelativePath || file.name)
        : file.name;

      const parts = relative.split("/").filter(Boolean);
      let parent = destination || null;

      for (let p = 0; p < parts.length - 1; p++) {
        const key = `${parent || "ROOT"}::${parts[p]}`;

        if (!folderCache.has(key)) {
          const existing = await findChild(parent, parts[p]);
          let folderId = existing?.type === "folder"
            ? existing.id
            : await makeFolder(parts[p], parent);

          folderCache.set(key, folderId);
        }

        parent = folderCache.get(key);
      }

      const buffer = await file.arrayBuffer();
      const blob = new Blob([buffer], {type:file.type || "application/octet-stream"});

      let content = "";
      let isText = false;

      if (isProbablyText(file.name, file.type)) {
        try {
          content = new TextDecoder("utf-8", {fatal:false}).decode(buffer);
          isText = true;
        } catch {}
      }

      const item = {
        id: uid(),
        name: parts[parts.length - 1],
        type: "file",
        parent,
        content: isText ? content : "",
        blob,
        size: file.size,
        mime: file.type || "application/octet-stream",
        style: "normal",
        createdAt: Date.now(),
        modifiedAt: Date.now()
      };

      await dbPut("items", item);
      setProgress(8 + ((i + 1) / files.length) * 88);
    }

    setProgress(0);
    await renderFiles();
    showToast(`${files.length} item${files.length === 1 ? "" : "s"} imported`);
  } catch (error) {
    console.error(error);
    setProgress(0);
    showToast("Import failed");
  }
}

function isProbablyText(name, type) {
  if (type && (type.startsWith("text/") || type.includes("json") || type.includes("javascript"))) return true;
  const e = getExtension(name);
  return [
    "txt","md","js","jsx","ts","tsx","json","html","htm","css","scss","sass",
    "py","java","c","cpp","h","hpp","php","sql","xml","yaml","yml","csv","env",
    "sh","bat","ps1","ini","toml","log"
  ].includes(e);
}

/* ---------------- ZIP writer ----------------
   This uses ZIP "STORE" entries (no deflate dependency).
   It is a valid ZIP archive and is ideal for a single HTML file.
   ---------------- */

const CRC_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
    table[n] = c >>> 0;
  }
  return table;
})();

function crc32(bytes) {
  let crc = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) {
    crc = CRC_TABLE[(crc ^ bytes[i]) & 0xff] ^ (crc >>> 8);
  }
  return (crc ^ 0xffffffff) >>> 0;
}

function u16(n) {
  const a = new Uint8Array(2);
  new DataView(a.buffer).setUint16(0, n, true);
  return a;
}

function u32(n) {
  const a = new Uint8Array(4);
  new DataView(a.buffer).setUint32(0, n >>> 0, true);
  return a;
}

function concatBytes(...arrays) {
  let total = arrays.reduce((sum, a) => sum + a.length, 0);
  const out = new Uint8Array(total);
  let offset = 0;
  for (const a of arrays) { out.set(a, offset); offset += a.length; }
  return out;
}

function zipLocalHeader(nameBytes, crc, size) {
  return concatBytes(
    new Uint8Array([0x50,0x4b,0x03,0x04]),
    u16(20), u16(0), u16(0),
    u16(0), u16(0),
    u32(crc), u32(size), u32(size),
    u16(nameBytes.length), u16(0),
    nameBytes
  );
}

function zipCentralHeader(nameBytes, crc, size, offset) {
  return concatBytes(
    new Uint8Array([0x50,0x4b,0x01,0x02]),
    u16(20), u16(20), u16(0), u16(0),
    u16(0), u16(0),
    u32(crc), u32(size), u32(size),
    u16(nameBytes.length), u16(0), u16(0), u16(0), u16(0),
    u32(0), u32(offset),
    nameBytes
  );
}

function zipEnd(count, centralSize, centralOffset) {
  return concatBytes(
    new Uint8Array([0x50,0x4b,0x05,0x06]),
    u16(0),u16(0),u16(count),u16(count),
    u32(centralSize),u32(centralOffset),
    u16(0)
  );
}

async function zipEntries(entries) {
  const localParts = [];
  const centralParts = [];
  let offset = 0;

  for (const entry of entries) {
    const nameBytes = new TextEncoder().encode(entry.name);
    const data = entry.data instanceof Uint8Array ? entry.data : new Uint8Array(await entry.data.arrayBuffer());
    const crc = crc32(data);
    const local = zipLocalHeader(nameBytes, crc, data.length);

    localParts.push(local, data);
    centralParts.push(zipCentralHeader(nameBytes, crc, data.length, offset));
    offset += local.length + data.length;
  }

  const central = concatBytes(...centralParts);
  const locals = concatBytes(...localParts);
  return new Blob([locals, central, zipEnd(entries.length, central.length, locals.length)], {type:"application/zip"});
}

async function collectZipEntries(itemId, basePath = "") {
  const item = await dbGet("items", itemId);
  if (!item) return [];

  if (item.type === "folder") {
    const entries = [];
    const folderPath = basePath + item.name + "/";
    entries.push({name:folderPath, data:new Uint8Array(0)});

    const childrenItems = await children(item.id);
    for (const child of childrenItems) {
      entries.push(...await collectZipEntries(child.id, folderPath));
    }
    return entries;
  }

  const data = item.blob instanceof Blob
    ? item.blob
    : new Blob([item.content || ""], {type:"application/octet-stream"});

  return [{name:basePath + item.name, data}];
}

async function createZip(ids, customName) {
  try {
    setProgress(10);
    let entries = [];

    for (let i = 0; i < ids.length; i++) {
      entries.push(...await collectZipEntries(ids[i]));
      setProgress(10 + ((i + 1) / ids.length) * 45);
    }

    const blob = await zipEntries(entries);
    setProgress(90);

    downloadBlob(blob, customName || "archive.zip");
    setProgress(0);
    showToast("ZIP download started");
  } catch (error) {
    console.error(error);
    setProgress(0);
    showToast("Could not create ZIP");
  }
}

/* ---------------- ZIP reader ----------------
   Reads standard ZIP files with STORE and DEFLATE.
   If a ZIP was created by this app, extraction is fully supported.
   Common external ZIPs using deflate are also supported through
   the browser's native DecompressionStream where available.
   ---------------- */

function findEndOfCentralDirectory(bytes) {
  for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
    if (bytes[i] === 0x50 && bytes[i+1] === 0x4b && bytes[i+2] === 0x05 && bytes[i+3] === 0x06) return i;
  }
  return -1;
}

function readU16(view, offset) { return view.getUint16(offset, true); }
function readU32(view, offset) { return view.getUint32(offset, true); }

async function readZip(blob) {
  const bytes = new Uint8Array(await blob.arrayBuffer());
  const view = new DataView(bytes.buffer);
  const eocd = findEndOfCentralDirectory(bytes);
  if (eocd < 0) throw new Error("Invalid ZIP");

  const count = readU16(view, eocd + 10);
  const centralOffset = readU32(view, eocd + 16);
  const entries = [];
  const decoder = new TextDecoder();

  let p = centralOffset;

  for (let i = 0; i < count; i++) {
    if (readU32(view,p) !== 0x02014b50) break;

    const flags = readU16(view,p+8);
    const method = readU16(view,p+10);
    const compressedSize = readU32(view,p+20);
    const uncompressedSize = readU32(view,p+24);
    const nameLength = readU16(view,p+28);
    const extraLength = readU16(view,p+30);
    const commentLength = readU16(view,p+32);
    const localOffset = readU32(view,p+42);

    const nameBytes = bytes.slice(p+46,p+46+nameLength);
    const name = decoder.decode(nameBytes);

    entries.push({
      name, flags, method, compressedSize, uncompressedSize, localOffset
    });

    p += 46 + nameLength + extraLength + commentLength;
  }

  return {bytes, view, entries};
}

async function extractZipEntry(zip, entry) {
  const {bytes, view} = zip;
  const p = entry.localOffset;

  if (readU32(view,p) !== 0x04034b50) throw new Error("Invalid local ZIP header");

  const nameLength = readU16(view,p+26);
  const extraLength = readU16(view,p+28);
  const start = p + 30 + nameLength + extraLength;
  const compressed = bytes.slice(start, start + entry.compressedSize);

  if (entry.method === 0) return compressed;

  if (entry.method === 8 && "DecompressionStream" in window) {
    const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  throw new Error("This ZIP uses a compression method not supported by this browser");
}

async function openZip(item) {
  try {
    const blob = item.blob instanceof Blob ? item.blob : new Blob([item.content || ""]);
    const zip = await readZip(blob);

    const rows = zip.entries.map((entry,index) => `
      <article class="item-card" style="min-height:135px;animation-delay:${Math.min(index*18,250)}ms">
        ${entry.name.endsWith("/") ? fileBadge(entry.name,"folder") : fileBadge(entry.name,"file")}
        <div class="item-name">${escapeHTML(entry.name)}</div>
        <div class="item-meta">${entry.method === 0 ? "Stored" : "Compressed"}</div>
      </article>
    `).join("");

    breadcrumbs.innerHTML = `
      <button class="crumb" onclick="goHome()">Home</button><span>/</span>
      <button class="crumb current">${escapeHTML(item.name)}</button>
    `;

    page.innerHTML = `
      <div class="hero">
        <div>
          <h1>${escapeHTML(item.name)}</h1>
          <div class="subtitle">ZIP contents · ${zip.entries.length} entries</div>
        </div>
        <div class="toolbar" style="margin:0">
          <button class="btn" onclick="extractZipToFolderById('${item.id}')">${ICONS.extract} Extract All</button>
          <button class="btn" onclick="downloadItem('${item.id}')">${ICONS.download} Download ZIP</button>
        </div>
      </div>
      <div class="grid">${rows || `<div class="empty">This ZIP is empty.</div>`}</div>
    `;

    currentFolder = null;
  } catch (error) {
    console.error(error);
    showToast("Unable to read this ZIP");
  }
}

async function extractZipToFolderById(id) {
  const item = await dbGet("items", id);
  if (item) await extractZipToFolder(item);
}

async function extractZipToFolder(item) {
  try {
    const blob = item.blob instanceof Blob ? item.blob : new Blob([item.content || ""]);
    const zip = await readZip(blob);

    const rootName = item.name.replace(/\.zip$/i,"") || "Extracted";
    const rootId = await makeFolder(rootName, item.parent || null);

    setProgress(5);

    for (let i = 0; i < zip.entries.length; i++) {
      const entry = zip.entries[i];
      let clean = entry.name.replace(/^\/+/,"").replace(/\.\./g,"");
      if (!clean) continue;

      const parts = clean.split("/").filter(Boolean);
      let parent = rootId;

      if (entry.name.endsWith("/")) {
        for (const part of parts) parent = await makeFolder(part,parent);
      } else {
        for (let p = 0; p < parts.length - 1; p++) parent = await makeFolder(parts[p],parent);

        const data = await extractZipEntry(zip,entry);
        const extension = getExtension(parts.at(-1));
        const text = isProbablyText(parts.at(-1),"") ? new TextDecoder().decode(data) : "";

        await dbPut("items",{
          id:uid(),name:parts.at(-1),type:"file",parent,
          content:text,blob:new Blob([data],{type:"application/octet-stream"}),
          size:data.length,mime:"application/octet-stream",style:"normal",
          createdAt:Date.now(),modifiedAt:Date.now(),fromZip:true
        });
      }

      setProgress(5 + ((i+1)/zip.entries.length)*90);
    }

    setProgress(0);
    showToast("ZIP extracted");
    if (view === "files") renderFiles();
  } catch (error) {
    console.error(error);
    setProgress(0);
    showToast(error.message || "Extraction failed");
  }
}

search.addEventListener("input", () => {

    page.innerHTML = `

    `;
  }
}

boot();

(function(){
 const KEY='file-manager-notes-v2';
 let notes=JSON.parse(localStorage.getItem(KEY)||'[]');
 let activeNote=null, zipFiles=[], zipSelected=null, zipCurrentFile=null;

 const $=id=>document.getElementById(id);
 const saveNotes=()=>localStorage.setItem(KEY,JSON.stringify(notes));
 function renderNotes(){
   const list=$('fmNoteList'); if(!list)return;
   list.innerHTML='';
   notes.forEach(n=>{
     const el=document.createElement('div'); el.className='fm-note-item'+(n.id===activeNote?' active':'');
     el.innerHTML='<b>'+esc(n.name||'Untitled')+'</b><div style="opacity:.5;font-size:11px">'+new Date(n.updated||Date.now()).toLocaleString()+'</div>';
     el.onclick=()=>{activeNote=n.id; loadNote()};
     list.appendChild(el);
   });
   if(!notes.length) list.innerHTML='<div style="opacity:.5;padding:10px">No notes yet.</div>';
 }
 function loadNote(){
   const n=notes.find(x=>x.id===activeNote);
   if(!n){$('fmNoteName').value='';$('fmNoteDesc').value='';$('fmNoteContent').value='';}
   else{$('fmNoteName').value=n.name||'';$('fmNoteDesc').value=n.desc||'';$('fmNoteContent').value=n.content||'';}
   renderNotes();
 }
 function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 $('fmNewNote').onclick=()=>{activeNote='n_'+Date.now();notes.unshift({id:activeNote,name:'Untitled Note',desc:'',content:'',updated:Date.now()});saveNotes();loadNote()};
 $('fmSaveNote').onclick=()=>{
   if(!activeNote)return $('fmNewNote').click();
   const n=notes.find(x=>x.id===activeNote);
   if(n){n.name=$('fmNoteName').value||'Untitled Note';n.desc=$('fmNoteDesc').value;n.content=$('fmNoteContent').value;n.updated=Date.now();saveNotes();renderNotes()}
 };
 $('fmDeleteNote').onclick=()=>{
   if(!activeNote)return;
   if(!confirm('Delete this note? This action cannot be undone.'))return;
   notes=notes.filter(n=>n.id!==activeNote);activeNote=null;saveNotes();loadNote();
 };
 $('fmDownloadNote').onclick=()=>{
   const name=($('fmNoteName').value||'note').replace(/[\\/:*?"<>|]/g,'_');
   const text=$('fmNoteContent').value;
   const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=name+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);
 };

 window.openFileManagerNotes=function(){$('fmNotesOverlay').classList.add('show');renderNotes();if(activeNote===null&&notes.length)activeNote=notes[0].id;loadNote()};

 // ZIP explorer uses the browser's native DecompressionStream where available.
 // It reads ZIP central directory entries and supports stored/deflate entries.
 function u16(a,o){return a[o]|a[o+1]<<8}
 function u32(a,o){return (a[o]|a[o+1]<<8|a[o+2]<<16|a[o+3]<<24)>>>0}
 function readZipEntries(buf){
   const a=new Uint8Array(buf), dv=new DataView(buf), out=[];
   let eocd=-1;
   for(let i=a.length-22;i>=Math.max(0,a.length-65557);i--) if(u32(a,i)===0x06054b50){eocd=i;break}
   if(eocd<0) throw Error('Invalid ZIP');
   const cdSize=u32(a,eocd+12), cdOff=u32(a,eocd+16); let p=cdOff, end=cdOff+cdSize;
   while(p<end && u32(a,p)===0x02014b50){
     const method=u16(a,p+10), comp=u32(a,p+20), uncomp=u32(a,p+24), nlen=u16(a,p+28), elen=u16(a,p+30), clen=u16(a,p+32), off=u32(a,p+42);
     const name=new TextDecoder().decode(a.slice(p+46,p+46+nlen));
     out.push({name,method,comp,uncomp,off,dir:name.endsWith('/')});
     p+=46+nlen+elen+clen;
   }
   return {a,entries:out};
 }
 async function zipEntryData(z,e){
   const a=z.a, p=e.off, n=u16(a,p+26), x=u16(a,p+28), start=p+30+n+x;
   const raw=a.slice(start,start+e.comp);
   if(e.method===0)return raw;
   if(e.method===8){
     if(typeof DecompressionStream==='undefined')throw Error('This browser does not support ZIP deflate extraction.');
     const ds=new DecompressionStream('deflate-raw');
     return new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer());
   }
   throw Error('Unsupported ZIP compression method.');
 }
 window.openZipExplorer=async function(file){
   try{
     const buf=await file.arrayBuffer(), z=readZipEntries(buf);zipCurrentFile=file;zipFiles=z.entries;zipSelected=null;
     $('fmZipTitle').textContent='ZIP Explorer — '+file.name;
     const list=$('fmZipList');list.innerHTML='';
     z.entries.forEach((e,i)=>{
       const row=document.createElement('div');row.className='fm-list-item';
       row.innerHTML='<div class="meta"><b>'+esc(e.name)+'</b><span>'+(e.dir?'Folder':(Math.round(e.uncomp/1024)+' KB'))+'</span></div><button class="fm-btn">'+(e.dir?'Folder':'Select')+'</button>';
       row.onclick=()=>{zipSelected=i;document.querySelectorAll('#fmZipList .fm-list-item').forEach(x=>x.style.outline='none');row.style.outline='2px solid rgba(255,255,255,.25)'};
       list.appendChild(row);
     });
     $('fmZipOverlay').classList.add('show');
   }catch(err){alert('Could not open ZIP: '+err.message)}
 };
 $('fmZipClose').onclick=()=>$('fmZipOverlay').classList.remove('show');
 async function extractEntries(entries){
   if(!zipCurrentFile)return;
   const z=readZipEntries(await zipCurrentFile.arrayBuffer());
   for(const e of entries){
     if(e.dir)continue;
     const data=await zipEntryData(z,e);
     const blob=new Blob([data],{type:'application/octet-stream'});
     const a=document.createElement('a');a.href=URL.createObjectURL(blob);
     a.download=e.name.split('/').pop()||'extracted-file';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);
   }
 }

 };

 };
