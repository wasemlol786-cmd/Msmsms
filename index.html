<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Manager</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- JSZip for handling zip files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #111827;
            --bg-card: #1f2937;
            --border-color: #374151;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --danger: #ef4444;
            --radius: 12px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 260px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--accent-color);
        }

        .brand-icon {
            width: 32px;
            height: 32px;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 15px;
            transition: var(--transition);
        }

        .nav-btn:hover, .nav-btn.active {
            background: rgba(99, 102, 241, 0.15);
            color: var(--text-main);
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(8px);
        }

        .breadcrumbs {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .crumb {
            cursor: pointer;
            transition: var(--transition);
        }

        .crumb:hover {
            color: var(--accent-color);
        }

        .actions {
            display: flex;
            gap: 12px;
        }

        /* Common Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: var(--radius);
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
        }

        .btn-primary { background: var(--accent-color); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); }

        .btn-secondary { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: var(--border-color); }

        .btn-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.4); }
        .btn-danger:hover { background: var(--danger); color: #fff; }

        .btn-icon { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 6px; border-radius: 6px; transition: var(--transition); }
        .btn-icon:hover { color: var(--text-main); background: var(--border-color); }

        /* Dynamic Views */
        .view-panel {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
            transition: var(--transition);
        }

        .view-panel.hidden { display: none; }

        /* Grid for Large File Cards */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 140px;
            position: relative;
            transition: var(--transition);
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .file-icon { width: 36px; height: 36px; }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 10px;
        }

        .card-meta {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Context Options Menu */
        .menu-dropdown {
            position: absolute;
            top: 40px;
            right: 15px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            z-index: 10;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .menu-item {
            padding: 10px 16px;
            background: none;
            border: none;
            color: var(--text-main);
            text-align: left;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .menu-item:hover { background: var(--border-color); }

        /* Editor Styling */
        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .editor-title-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .title-input {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-main);
            font-size: 18px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .title-input:focus {
            border-color: var(--border-color);
            outline: none;
        }

        .editor-controls { display: flex; gap: 10px; }

        .custom-select {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 8px 12px;
            outline: none;
        }

        .editor-wrapper {
            display: flex;
            height: calc(100vh - 200px);
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .line-numbers {
            width: 50px;
            background: rgba(0, 0, 0, 0.2);
            border-right: 1px solid var(--border-color);
            padding: 16px 0;
            text-align: center;
            color: var(--text-muted);
            font-family: monospace;
            font-size: 14px;
            line-height: 1.6;
            user-select: none;
        }

        textarea#file-editor-textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 16px;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            outline: none;
            white-space: pre;
            overflow-x: auto;
        }

        /* Font Styles */
        .font-sans { font-family: 'Inter', sans-serif !important; }
        .font-mono { font-family: 'Courier New', Courier, monospace !important; }
        .font-serif { font-family: 'Georgia', serif !important; }
        .font-fancy { font-family: 'Comic Sans MS', 'Cursive', sans-serif !important; }

        /* Zip & Notes UI */
        .zip-item {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .note-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .note-card textarea {
            background: transparent;
            border: none;
            color: var(--text-main);
            resize: none;
            outline: none;
            height: 120px;
        }

        /* Custom Modal System */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px;
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .text-input {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            outline: none;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <i data-lucide="folder-git-2" class="brand-icon"></i>
                <h2>File Manager</h2>
            </div>
            <nav class="nav-menu">
                <button class="nav-btn active" id="btn-files">
                    <i data-lucide="hard-drive"></i>
                    <span>My Workspace</span>
                </button>
                <button class="nav-btn" id="btn-notes">
                    <i data-lucide="notebook-pen"></i>
                    <span>Notes</span>
                </button>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Header & Path Navigation -->
            <header class="top-bar">
                <div class="breadcrumbs" id="breadcrumbs"></div>
                <div class="actions">
                    <label for="file-upload-input" class="btn btn-secondary">
                        <i data-lucide="upload-cloud"></i> Upload
                    </label>
                    <input type="file" id="file-upload-input" hidden multiple>
                    
                    <button class="btn btn-secondary" id="btn-create-folder">
                        <i data-lucide="folder-plus"></i> New Folder
                    </button>
                    <button class="btn btn-primary" id="btn-create-file">
                        <i data-lucide="file-plus"></i> New File
                    </button>
                </div>
            </header>

            <!-- Workspace View -->
            <section id="workspace-view" class="view-panel active">
                <div class="file-grid" id="file-grid"></div>
            </section>

            <!-- Editor View -->
            <section id="editor-view" class="view-panel hidden">
                <div class="editor-header">
                    <div class="editor-title-container">
                        <button class="btn-icon" id="btn-close-editor"><i data-lucide="arrow-left"></i></button>
                        <i id="editor-file-icon" data-lucide="file-text"></i>
                        <input type="text" id="editor-file-name" class="title-input">
                    </div>
                    <div class="editor-controls">
                        <select id="font-style-select" class="custom-select">
                            <option value="font-sans">Default Font</option>
                            <option value="font-mono">Monospace Code</option>
                            <option value="font-serif">Serif Elegant</option>
                            <option value="font-fancy">Stylized</option>
                        </select>
                        <button class="btn btn-secondary" id="btn-download-file"><i data-lucide="download"></i> Download</button>
                        <button class="btn btn-danger" id="btn-clear-editor"><i data-lucide="eraser"></i> Clear</button>
                        <button class="btn btn-primary" id="btn-save-file"><i data-lucide="save"></i> Save</button>
                    </div>
                </div>
                <div class="editor-wrapper">
                    <div class="line-numbers" id="line-numbers">1</div>
                    <textarea id="file-editor-textarea" spellcheck="false" placeholder="Start typing..."></textarea>
                </div>
            </section>

            <!-- Zip Viewer Modal Panel -->
            <section id="zip-view" class="view-panel hidden">
                <div class="editor-header">
                    <div class="editor-title-container">
                        <button class="btn-icon" id="btn-close-zip"><i data-lucide="arrow-left"></i></button>
                        <i data-lucide="file-archive"></i>
                        <h3 id="zip-file-name">Archive Viewer</h3>
                    </div>
                </div>
                <div class="zip-contents" id="zip-contents"></div>
            </section>

            <!-- Notes Section -->
            <section id="notes-view" class="view-panel hidden">
                <div class="notes-header">
                    <h3>Quick Notes</h3>
                    <button class="btn btn-primary" id="btn-add-note"><i data-lucide="plus"></i> Add Note</button>
                </div>
                <div class="notes-grid" id="notes-grid"></div>
            </section>
        </main>
    </div>

    <!-- Custom Modal System -->
    <div class="modal-overlay hidden" id="custom-modal">
        <div class="modal-box">
            <h3 id="modal-title">Confirmation</h3>
            <p id="modal-message">Are you sure you want to proceed?</p>
            <div class="modal-input-container hidden" id="modal-input-wrap">
                <input type="text" id="modal-input" class="text-input" placeholder="Type here...">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="modal-btn-cancel">Cancel</button>
                <button class="btn btn-danger" id="modal-btn-confirm">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        let state = JSON.parse(localStorage.getItem('fm_state')) || {
            currentFolderId: 'root',
            folders: [
                { id: 'root', name: 'Root', parentId: null }
            ],
            files: [],
            notes: []
        };

        let activeFileId = null;

        function saveState() {
            localStorage.setItem('fm_state', JSON.stringify(state));
        }

        function getFileTypeDetails(fileName) {
            const ext = fileName.split('.').pop().toLowerCase();
            switch (ext) {
                case 'js': return { icon: 'code-2', color: '#f7df1e' };
                case 'py': return { icon: 'terminal', color: '#3776ab' };
                case 'html': return { icon: 'file-code', color: '#e34f26' };
                case 'css': return { icon: 'palette', color: '#1572b6' };
                case 'json': return { icon: 'file-json', color: '#000000' };
                case 'zip': return { icon: 'file-archive', color: '#eab308' };
                case 'png':
                case 'jpg': return { icon: 'image', color: '#ec4899' };
                default: return { icon: 'file-text', color: '#9ca3af' };
            }
        }

        function renderWorkspace() {
            const grid = document.getElementById('file-grid');
            if (!grid) return;
            grid.innerHTML = '';

            const subFolders = state.folders.filter(f => f.parentId === state.currentFolderId);
            subFolders.forEach(folder => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-top">
                        <i data-lucide="folder" class="file-icon" style="color: #6366f1"></i>
                        <button class="btn-icon context-btn" data-id="${folder.id}" data-type="folder"><i data-lucide="more-vertical"></i></button>
                    </div>
                    <div>
                        <div class="card-title">${folder.name}</div>
                        <div class="card-meta">Folder</div>
                    </div>
                `;
                card.addEventListener('click', (e) => {
                    if (!e.target.closest('.context-btn')) {
                        state.currentFolderId = folder.id;
                        renderWorkspace();
                        renderBreadcrumbs();
                    }
                });
                grid.appendChild(card);
            });

            const currentFiles = state.files.filter(f => f.folderId === state.currentFolderId);
            currentFiles.forEach(file => {
                const details = getFileTypeDetails(file.name);
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-top">
                        <i data-lucide="${details.icon}" class="file-icon" style="color: ${details.color}"></i>
                        <button class="btn-icon context-btn" data-id="${file.id}" data-type="file"><i data-lucide="more-vertical"></i></button>
                    </div>
                    <div>
                        <div class="card-title">${file.name}</div>
                        <div class="card-meta">${file.lines || 0} lines</div>
                    </div>
                `;
                card.addEventListener('click', (e) => {
                    if (!e.target.closest('.context-btn')) {
                        if (file.name.endsWith('.zip')) {
                            openZipViewer(file);
                        } else {
                            openEditor(file.id);
                        }
                    }
                });
                grid.appendChild(card);
            });

            if (window.lucide) lucide.createIcons();
            attachContextMenuListeners();
        }

        function renderBreadcrumbs() {
            const breadcrumbs = document.getElementById('breadcrumbs');
            if (!breadcrumbs) return;
            breadcrumbs.innerHTML = '';
            
            let chain = [];
            let curr = state.folders.find(f => f.id === state.currentFolderId);
            while (curr) {
                chain.unshift(curr);
                curr = state.folders.find(f => f.id === curr.parentId);
            }

            chain.forEach((folder, idx) => {
                const span = document.createElement('span');
                span.className = 'crumb';
                span.innerText = folder.name;
                span.onclick = () => {
                    state.currentFolderId = folder.id;
                    renderWorkspace();
                    renderBreadcrumbs();
                };
                breadcrumbs.appendChild(span);

                if (idx < chain.length - 1) {
                    const separator = document.createElement('span');
                    separator.innerText = ' / ';
                    breadcrumbs.appendChild(separator);
                }
            });
        }

        const editorArea = document.getElementById('file-editor-textarea');
        const lineNumbers = document.getElementById('line-numbers');

        if (editorArea && lineNumbers) {
            editorArea.addEventListener('input', updateLineNumbers);
            editorArea.addEventListener('scroll', () => {
                lineNumbers.scrollTop = editorArea.scrollTop;
            });
        }

        function updateLineNumbers() {
            if (!editorArea || !lineNumbers) return;
            const lines = editorArea.value.split('\n').length;
            lineNumbers.innerHTML = Array.from({ length: lines }, (_, i) => i + 1).join('<br>');
        }

        function openEditor(fileId) {
            activeFileId = fileId;
            const file = state.files.find(f => f.id === fileId);
            if (!file) return;
            
            document.getElementById('editor-file-name').value = file.name;
            editorArea.value = file.content || '';
            
            document.getElementById('workspace-view').classList.add('hidden');
            document.getElementById('editor-view').classList.remove('hidden');
            
            updateLineNumbers();
        }

        document.getElementById('btn-close-editor').onclick = () => {
            document.getElementById('editor-view').classList.add('hidden');
            document.getElementById('workspace-view').classList.remove('hidden');
            renderWorkspace();
        };

        document.getElementById('btn-save-file').onclick = () => {
            const file = state.files.find(f => f.id === activeFileId);
            if (file) {
                file.name = document.getElementById('editor-file-name').value;
                file.content = editorArea.value;
                file.lines = editorArea.value.split('\n').length;
                saveState();
                showModal('Success', 'File saved successfully!', false);
            }
        };

        document.getElementById('btn-clear-editor').onclick = () => {
            showModal('Clear Editor', 'Are you sure you want to clear all contents?', true, () => {
                editorArea.value = '';
                updateLineNumbers();
            });
        };

        document.getElementById('font-style-select').onchange = (e) => {
            editorArea.className = e.target.value;
        };

        function openZipViewer(file) {
            document.getElementById('workspace-view').classList.add('hidden');
            const zipView = document.getElementById('zip-view');
            zipView.classList.remove('hidden');
            document.getElementById('zip-file-name').innerText = file.name;

            const zipContentDiv = document.getElementById('zip-contents');
            zipContentDiv.innerHTML = 'Loading archive content...';

            if (window.JSZip) {
                JSZip.loadAsync(file.rawBase64 || file.content).then(zip => {
                    zipContentDiv.innerHTML = '';
                    zip.forEach((relativePath, zipEntry) => {
                        const item = document.createElement('div');
                        item.className = 'zip-item';
                        item.innerHTML = `<i data-lucide="${zipEntry.dir ? 'folder' : 'file'}"></i> <span>${relativePath}</span>`;
                        zipContentDiv.appendChild(item);
                    });
                    if (window.lucide) lucide.createIcons();
                }).catch(() => {
                    zipContentDiv.innerHTML = 'Unable to preview ZIP file contents.';
                });
            }
        }

        document.getElementById('btn-close-zip').onclick = () => {
            document.getElementById('zip-view').classList.add('hidden');
            document.getElementById('workspace-view').classList.remove('hidden');
        };

        document.getElementById('btn-create-folder').onclick = () => {
            promptModal('New Folder', 'Enter folder name:', (name) => {
                if (name) {
                    state.folders.push({ id: 'f_' + Date.now(), name: name, parentId: state.currentFolderId });
                    saveState();
                    renderWorkspace();
                }
            });
        };

        document.getElementById('btn-create-file').onclick = () => {
            promptModal('New File', 'Enter file name (e.g., script.js):', (name) => {
                if (name) {
                    const newFile = { id: 'file_' + Date.now(), name: name, content: '', lines: 1, folderId: state.currentFolderId };
                    state.files.push(newFile);
                    saveState();
                    renderWorkspace();
                    openEditor(newFile.id);
                }
            });
        };

        document.getElementById('file-upload-input').onchange = (e) => {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    state.files.push({
                        id: 'file_' + Date.now() + Math.random(),
                        name: file.name,
                        content: evt.target.result,
                        lines: evt.target.result.split('\n').length,
                        folderId: state.currentFolderId
                    });
                    saveState();
                    renderWorkspace();
                };
                reader.readAsText(file);
            });
        };

        function attachContextMenuListeners() {
            document.querySelectorAll('.context-btn').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    const type = btn.dataset.type;
                    
                    removeContextMenus();

                    const menu = document.createElement('div');
                    menu.className = 'menu-dropdown';
                    menu.innerHTML = `
                        <button class="menu-item" id="opt-rename"><i data-lucide="edit-3"></i> Rename</button>
                        <button class="menu-item" id="opt-move"><i data-lucide="folder-output"></i> Move</button>
                        <button class="menu-item" id="opt-delete" style="color:var(--danger)"><i data-lucide="trash-2"></i> Delete</button>
                    `;

                    btn.parentElement.appendChild(menu);
                    if (window.lucide) lucide.createIcons();

                    document.getElementById('opt-rename').onclick = () => {
                        promptModal('Rename', 'Enter new name:', (newName) => {
                            if (newName) {
                                if (type === 'folder') state.folders.find(f => f.id === id).name = newName;
                                else state.files.find(f => f.id === id).name = newName;
                                saveState();
                                renderWorkspace();
                            }
                        });
                    };

                    document.getElementById('opt-move').onclick = () => {
                        const folderList = state.folders.map(f => f.name).join(', ');
                        promptModal('Move Item', `Available Folders: [ ${folderList} ]\nType target folder name (or "Root"):`, (targetName) => {
                            if (targetName) {
                                let targetFolder = state.folders.find(f => f.name.toLowerCase() === targetName.trim().toLowerCase());
                                if (targetName.trim().toLowerCase() === 'root') {
                                    targetFolder = { id: 'root' };
                                }
                                
                                if (targetFolder) {
                                    if (type === 'file') {
                                        state.files.find(f => f.id === id).folderId = targetFolder.id;
                                    } else if (type === 'folder' && id !== targetFolder.id) {
                                        state.folders.find(f => f.id === id).parentId = targetFolder.id;
                                    }
                                    saveState();
                                    renderWorkspace();
                                    showModal('Moved', 'Item moved successfully!', false);
                                } else {
                                    showModal('Error', 'Folder not found!', false);
                                }
                            }
                        });
                    };

                    document.getElementById('opt-delete').onclick = () => {
                        showModal('Confirm Delete', 'Are you sure you want to delete this item?', true, () => {
                            if (type === 'folder') state.folders = state.folders.filter(f => f.id !== id);
                            else state.files = state.files.filter(f => f.id !== id);
                            saveState();
                            renderWorkspace();
                        });
                    };
                };
            });
        }

        function removeContextMenus() {
            document.querySelectorAll('.menu-dropdown').forEach(m => m.remove());
        }
        window.onclick = () => removeContextMenus();

        const modal = document.getElementById('custom-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMsg = document.getElementById('modal-message');
        const modalInputWrap = document.getElementById('modal-input-wrap');
        const modalInput = document.getElementById('modal-input');
        const modalConfirmBtn = document.getElementById('modal-btn-confirm');
        const modalCancelBtn = document.getElementById('modal-btn-cancel');

        function showModal(title, msg, isConfirm = false, onConfirm = null) {
            modalTitle.innerText = title;
            modalMsg.innerText = msg;
            modalInputWrap.classList.add('hidden');
            modal.classList.remove('hidden');

            modalCancelBtn.onclick = () => modal.classList.add('hidden');
            modalConfirmBtn.onclick = () => {
                modal.classList.add('hidden');
                if (onConfirm) onConfirm();
            };
        }

        function promptModal(title, msg, onConfirm) {
            modalTitle.innerText = title;
            modalMsg.innerText = msg;
            modalInput.value = '';
            modalInputWrap.classList.remove('hidden');
            modal.classList.remove('hidden');

            modalCancelBtn.onclick = () => modal.classList.add('hidden');
            modalConfirmBtn.onclick = () => {
                modal.classList.add('hidden');
                if (onConfirm) onConfirm(modalInput.value);
            };
        }

        document.getElementById('btn-files').onclick = () => {
            document.getElementById('notes-view').classList.add('hidden');
            document.getElementById('workspace-view').classList.remove('hidden');
            document.getElementById('btn-notes').classList.remove('active');
            document.getElementById('btn-files').classList.add('active');
        };

        document.getElementById('btn-notes').onclick = () => {
            document.getElementById('workspace-view').classList.add('hidden');
            document.getElementById('notes-view').classList.remove('hidden');
            document.getElementById('btn-files').classList.remove('active');
            document.getElementById('btn-notes').classList.add('active');
            renderNotes();
        };

        function renderNotes() {
            const grid = document.getElementById('notes-grid');
            if (!grid) return;
            grid.innerHTML = '';
            state.notes.forEach(note => {
                const card = document.createElement('div');
                card.className = 'note-card';
                card.innerHTML = `
                    <textarea placeholder="Write a note...">${note.text}</textarea>
                    <button class="btn btn-danger btn-icon" style="align-self: flex-end"><i data-lucide="trash"></i></button>
                `;
                const txt = card.querySelector('textarea');
                txt.oninput = () => {
                    note.text = txt.value;
                    saveState();
                };
                card.querySelector('button').onclick = () => {
                    state.notes = state.notes.filter(n => n.id !== note.id);
                    saveState();
                    renderNotes();
                };
                grid.appendChild(card);
            });
            if (window.lucide) lucide.createIcons();
        }

        document.getElementById('btn-add-note').onclick = () => {
            state.notes.push({ id: 'n_' + Date.now(), text: '' });
            saveState();
            renderNotes();
        };

        window.addEventListener('DOMContentLoaded', () => {
            renderWorkspace();
            renderBreadcrumbs();
            if (window.lucide) lucide.createIcons();
        });
    </script>
</body>
</html>
