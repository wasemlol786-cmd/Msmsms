<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>File Manager</title>
<style>
:root{--bg:#0b0d12;--panel:#11151d;--panel2:#171c25;--border:#252c38;--text:#f4f7fb;--muted:#8e98a8;--accent:#7c5cff;--danger:#ef476f;--shadow:0 18px 50px #0008}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#1b1538 0,transparent 34%),var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif;height:100vh;overflow:hidden}
button,input,textarea,select{font:inherit}button{border:0;color:inherit;cursor:pointer}.app{display:flex;height:100vh}.sidebar{width:250px;background:#0d1016eF;border-right:1px solid var(--border);padding:22px 14px;display:flex;flex-direction:column;gap:8px}.brand{font-size:20px;font-weight:800;padding:10px 12px 24px}.nav{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;color:var(--muted);background:transparent}.nav:hover,.nav.active{background:var(--panel2);color:var(--text)}.spacer{flex:1}.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:72px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 22px;background:#0b0d12cc;backdrop-filter:blur(18px)}.crumbs{flex:1;white-space:nowrap;overflow:auto;color:var(--muted)}.crumbs span{cursor:pointer}.crumbs .here{color:var(--text);font-weight:700}.search{width:220px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);outline:none}.content{padding:22px;overflow:auto;flex:1}.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:18px;flex-wrap:wrap}.btn{background:var(--panel2);border:1px solid var(--border);padding:10px 13px;border-radius:10px}.btn:hover{border-color:#465064;transform:translateY(-1px)}.btn.primary{background:var(--accent);border-color:var(--accent)}.btn.danger{background:#351622;border-color:#633044;color:#ff9bb2}.title{font-size:27px;font-weight:800;margin:3px 0 6px}.sub{color:var(--muted);margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}.card{position:relative;background:linear-gradient(145deg,#151a23,#10141b);border:1px solid var(--border);border-radius:15px;padding:18px;min-height:155px;transition:.2s;box-shadow:0 5px 22px #0002}.card:hover{transform:translateY(-3px);border-color:#414b5c}.card .icon{font-size:34px;margin-bottom:20px}.card .name{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:var(--muted);margin-top:7px}.more{position:absolute;right:10px;top:10px;background:transparent;color:var(--muted);font-size:20px;padding:4px 8px;border-radius:8px}.more:hover{background:#ffffff0b;color:white}.menu{position:fixed;z-index:50;min-width:185px;background:#151a22;border:1px solid #343c49;border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none}.menu button{display:block;width:100%;background:none;text-align:left;padding:10px;border-radius:8px}.menu button:hover{background:#ffffff0a}.empty{padding:70px 20px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:15px}.editor{display:none;position:fixed;inset:0;background:#090b10;z-index:80;flex-direction:column}.editor.show{display:flex}.editorbar{height:64px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:10px 16px}.editorTitle{flex:1}.editorTitle input{width:100%;background:transparent;border:0;outline:0;color:white;font-size:16px;font-weight:750}.editorbody{flex:1;display:flex;min-height:0}.lines{width:58px;background:#0d1016;color:#566071;text-align:right;padding:18px 10px;overflow:hidden;user-select:none;line-height:1.55}.code{flex:1;resize:none;background:#0b0e14;color:#eef2f7;border:0;outline:0;padding:18px;line-height:1.55;font:14px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;overflow:auto}.modalback{position:fixed;inset:0;background:#0009;backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:100}.modalback.show{display:flex}.modal{width:min(500px,92vw);background:#151a22;border:1px solid #343c49;border-radius:18px;padding:22px;box-shadow:var(--shadow)}.modal h2{margin:0 0 8px}.modal p{color:var(--muted);line-height:1.5}.field{margin:13px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;background:#0e1219;border:1px solid var(--border);color:white;border-radius:10px;padding:11px;outline:none}.field textarea{min-height:180px;resize:vertical}.modalactions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.toast{position:fixed;right:18px;bottom:18px;background:#171d27;border:1px solid var(--border);padding:12px 15px;border-radius:11px;box-shadow:var(--shadow);transform:translateY(20px);opacity:0;pointer-events:none;transition:.25s;z-index:200}.toast.show{transform:none;opacity:1}.noteLayout{display:grid;grid-template-columns:280px 1fr;gap:14px;height:calc(100vh - 150px)}.notesList,.noteEditor{background:var(--panel);border:1px solid var(--border);border-radius:15px;overflow:hidden}.notesList{overflow:auto}.noteItem{padding:14px;border-bottom:1px solid var(--border);cursor:pointer}.noteItem:hover,.noteItem.active{background:var(--panel2)}.noteEditor{display:flex;flex-direction:column;padding:18px}.noteEditor input,.noteEditor textarea{background:#0c1016;border:1px solid var(--border);color:white;border-radius:10px;padding:12px;outline:0}.noteEditor textarea{flex:1;resize:none;margin-top:10px;line-height:1.6}.hidden{display:none!important}@media(max-width:760px){.sidebar{width:66px;padding:14px 8px}.brand{font-size:0}.brand:after{content:"FM";font-size:17px}.nav span{display:none}.search{width:130px}.noteLayout{grid-template-columns:1fr}.notesList{height:180px}.noteEditor{min-height:400px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">File Manager</div>
  <button class="nav active" data-view="home"><span>⌂</span><span>My Files</span></button>
  <button class="nav" data-view="notes"><span>▤</span><span>Notes</span></button>
  <button class="nav" data-view="trash"><span>♲</span><span>Trash</span></button>
  <div class="spacer"></div>
  <button class="nav" id="importBtn"><span>↑</span><span>Import</span></button>
  <input id="fileInput" type="file" multiple hidden>
  <input id="folderInput" type="file" webkitdirectory directory multiple hidden>
</aside>
<main class="main">
<header class="top">
  <div class="crumbs" id="crumbs"></div>
  <input class="search" id="search" placeholder="Search files...">
</header>
<section class="content" id="content"></section>
</main>
</div>

<div class="menu" id="menu"></div>
<div class="modalback" id="modalback"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<div class="editor" id="editor">
  <div class="editorbar">
    <button class="btn" id="closeEditor">Close</button>
    <div class="editorTitle"><input id="editorName"></div>
    <select class="btn" id="styleSelect"><option value="normal">Normal</option><option value="serif">Serif</option><option value="mono">Monospace</option><option value="wide">Wide</option></select>
    <button class="btn primary" id="saveEditor">Save</button>
  </div>
  <div class="editorbody"><div class="lines" id="lines">1</div><textarea class="code" id="code" spellcheck="false"></textarea></div>
</div>

<script>
/* File Manager — single-file app */
const DB_NAME="FileManagerDB", DB_VER=1;
let db, currentFolder=null, currentView="home", currentEdit=null, currentNote=null;
const $=s=>document.querySelector(s), content=$("#content"), menu=$("#menu"), modalback=$("#modalback");

function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function ext(name){return (name.split(".").pop()||"").toLowerCase()}
function icon(name,type){if(type==="folder")return "▰";let e=ext(name);return {js:"JS",ts:"TS",py:"PY",html:"HTML",css:"CSS",json:"{}",md:"MD",txt:"TXT",zip:"ZIP",java:"JAVA",cpp:"C++",c:"C",xml:"XML",sql:"SQL",php:"PHP" }[e]||"FILE"}
function tx(store,mode="readonly"){return db.transaction(store,mode).objectStore(store)}
function req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function all(store){return req(tx(store).getAll())}
async function get(store,key){return req(tx(store).get(key))}
async function put(store,v){return req(tx(store,"readwrite").put(v))}
async function del(store,key){return req(tx(store,"readwrite").delete(key))}
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains("items"))d.createObjectStore("items",{keyPath:"id"});if(!d.objectStoreNames.contains("notes"))d.createObjectStore("notes",{keyPath:"id"});if(!d.objectStoreNames.contains("trash"))d.createObjectStore("trash",{keyPath:"id"})};r.onsuccess=()=>{db=r.result;resolve()};r.onerror=()=>reject(r.error)})}
async function init(){await openDB();renderHome()}
function toast(s){let t=$("#toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
function showModal(title,body,actions){$("#modal").innerHTML=`<h2>${title}</h2>${body}<div class="modalactions">${actions}</div>`;modalback.classList.add("show")}
function closeModal(){modalback.classList.remove("show")}
modalback.addEventListener("click",e=>{if(e.target===modalback)closeModal()});

function modalInput(title,label,def="",callback){
 showModal(title,`<div class="field"><label>${label}</label><input id="modalInput" value="${esc(def)}"></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="modalOk">Continue</button>`);
 $("#modalOk").onclick=()=>{let v=$("#modalInput").value.trim();if(!v)return;closeModal();callback(v)}
 setTimeout(()=>$("#modalInput").focus(),30)
}
function confirmAction(title,text,callback,danger=true){
 showModal(title,`<p>${esc(text)}</p>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn ${danger?"danger":"primary"} id="confirmOk">Confirm</button>`);
 $("#confirmOk").onclick=()=>{closeModal();callback()}
}

async function children(parent,trash=false){let a=await all(trash?"trash":"items");return a.filter(x=>(x.parent||null)===(parent||null))}
async function renderHome(){
 currentView="home";$("#search").placeholder="Search files...";
 $("#content").innerHTML=`<div class="title">My Files</div><div class="sub">Your personal workspace</div><div class="toolbar"><button class="btn primary" onclick="newFile()">+ File</button><button class="btn" onclick="newFolder()">+ Folder</button><button class="btn" onclick="chooseImport(false)">Import Files</button><button class="btn" onclick="chooseImport(true)">Import Folder</button></div><div id="grid" class="grid"></div>`;
 renderGrid()
}
async function renderGrid(){
 let arr=await children(currentFolder), q=$("#search").value.toLowerCase();arr=arr.filter(x=>x.name.toLowerCase().includes(q));
 $("#crumbs").innerHTML=await breadcrumb(currentFolder);
 let g=$("#grid"); if(!arr.length){g.innerHTML=`<div class="empty">This folder is empty.</div>`;return}
 g.innerHTML=arr.map(x=>`<div class="card" ondblclick="openItem('${x.id}')"><button class="more" onclick="event.stopPropagation();openMenu(event,'${x.id}',false)">⋯</button><div class="icon">${icon(x.name,x.type)}</div><div class="name">${esc(x.name)}</div><div class="meta">${x.type==="folder"?"Folder":(x.size?formatSize(x.size):"File")}</div></div>`).join("")
}
async function breadcrumb(id){
 let out=[`<span onclick="goHome()">Home</span>`], chain=[];let x=id?await get("items",id):null;
 while(x){chain.unshift(x);x=x.parent?await get("items",x.parent):null}
 chain.forEach((x,i)=>out.push(`<span> / </span><span class="${i===chain.length-1?"here":""}" onclick="currentFolder='${x.id}';renderGrid()">${esc(x.name)}</span>`));
 return out.join("")
}
function goHome(){currentFolder=null;renderGrid()}
async function openItem(id){let x=await get("items",id);if(x.type==="folder"){currentFolder=x.id;renderGrid()}else if(ext(x.name)==="zip"){await extractZip(id)}else openEditor(x)}
function newFile(){modalInput("Create file","File name","untitled.txt",async n=>{await put("items",{id:uid(),name:n,type:"file",parent:currentFolder,content:"",style:"normal",created:Date.now(),modified:Date.now()});renderGrid();toast("File created")})}
function newFolder(){modalInput("Create folder","Folder name","New Folder",async n=>{await put("items",{id:uid(),name:n,type:"folder",parent:currentFolder,created:Date.now(),modified:Date.now()});renderGrid();toast("Folder created")})}
function chooseImport(folder){(folder?$("#folderInput"):$("#fileInput")).click()}
$("#fileInput").onchange=async e=>{await importFiles([...e.target.files],currentFolder);e.target.value=""}
$("#folderInput").onchange=async e=>{await importFiles([...e.target.files],currentFolder,true);e.target.value=""}
async function importFiles(files,parent,folderMode=false){
 let map={};for(let f of files){let rel=folderMode?(f.webkitRelativePath||f.name):f.name, parts=rel.split("/");let p=parent;
 for(let i=0;i<parts.length-1;i++){let key=(p||"root")+"|"+parts[i];if(!map[key]){let ex=(await children(p)).find(x=>x.type==="folder"&&x.name===parts[i]);map[key]=ex?.id||uid();if(!ex)await put("items",{id:map[key],name:parts[i],type:"folder",parent:p,created:Date.now(),modified:Date.now()})}p=map[key]}
 await put("items",{id:uid(),name:parts.at(-1),type:"file",parent:p,content:await f.text(),size:f.size,blob:f.type,created:Date.now(),modified:Date.now()})
 }renderGrid();toast("Imported successfully")
}
async function openEditor(x){currentEdit=x.id;$("#editorName").value=x.name;$("#code").value=x.content||"";$("#styleSelect").value=x.style||"normal";updateLines();$("#editor").classList.add("show");applyStyle()}
$("#closeEditor").onclick=()=>$("#editor").classList.remove("show");
$("#code").addEventListener("input",updateLines);$("#code").addEventListener("scroll",()=>$("#lines").scrollTop=$("#code").scrollTop);
function updateLines(){let n=$("#code").value.split("\n").length;$("#lines").textContent=Array.from({length:n},(_,i)=>i+1).join("\n")}
function applyStyle(){let v=$("#styleSelect").value, c=$("#code");c.style.fontFamily=v==="serif"?"Georgia,serif":v==="mono"?"ui-monospace,monospace":"ui-monospace,monospace";c.style.letterSpacing=v==="wide"?".08em":"0"}
$("#styleSelect").onchange=applyStyle;
$("#saveEditor").onclick=async()=>{let x=await get("items",currentEdit);x.name=$("#editorName").value.trim()||x.name;x.content=$("#code").value;x.style=$("#styleSelect").value;x.modified=Date.now();await put("items",x);$("#editor").classList.remove("show");renderGrid();toast("Saved")}
function openMenu(e,id,trash){menu.innerHTML="";let x=trash?null:null;
 const add=(label,fn,d=false)=>{let b=document.createElement("button");b.textContent=label;b.onclick=()=>{menu.style.display="none";fn()};if(d)b.style.color="#ff9bb2";menu.appendChild(b)};
 if(trash){add("Restore",()=>restore(id));add("Delete permanently",()=>permanentDelete(id),true)}
 else{
  add("Open",()=>openItem(id));add("Rename",()=>rename(id));add("Move",()=>moveItem(id));add("Move out",()=>moveOut(id));add("Download",()=>downloadItem(id));add("Compress to ZIP",()=>compressItems([id]));add("Delete",()=>trashItem(id),true)
 }
 menu.style.left=Math.min(e.clientX,innerWidth-205)+"px";menu.style.top=Math.min(e.clientY,innerHeight-300)+"px";menu.style.display="block"
}
document.addEventListener("click",e=>{if(!e.target.closest(".more")&&!e.target.closest("#menu"))menu.style.display="none"})
async function rename(id){let x=await get("items",id);modalInput("Rename","New name",x.name,async n=>{x.name=n;x.modified=Date.now();await put("items",x);renderGrid();toast("Renamed")})}
async function moveOut(id){let x=await get("items",id);if(!x.parent){toast("Already in Home");return}x.parent=null;await put("items",x);renderGrid();toast("Moved out")}
async function moveItem(id){let x=await get("items",id), folders=(await all("items")).filter(y=>y.type==="folder"&&y.id!==id);showModal("Move item",`<div class="field"><label>Destination</label><select id="dest"><option value="">Home</option>${folders.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join("")}</select></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="moveOk">Move</button>`);$("#moveOk").onclick=async()=>{x.parent=$("#dest").value||null;await put("items",x);closeModal();renderGrid();toast("Moved")}
}
async function trashItem(id){let x=await get("items",id);confirmAction("Move to Trash",`Move "${x.name}" to Trash? You can restore it later.`,async()=>{x.deletedAt=Date.now();await put("trash",x);await del("items",id);if(x.type==="folder")await trashDescendants(id);renderGrid();toast("Moved to Trash")})}
async function trashDescendants(parent){for(let x of await children(parent)){await put("trash",{...x,deletedAt:Date.now()});await del("items",x.id);if(x.type==="folder")await trashDescendants(x.id)}}
async function restore(id){let x=await get("trash",id);if(!x)return;x.parent=null;delete x.deletedAt;await put("items",x);await del("trash",id);renderTrash();toast("Restored to Home")}
async function permanentDelete(id){let x=await get("trash",id);confirmAction("Delete permanently",`"${x.name}" will be permanently deleted. This cannot be undone.`,async()=>{await del("trash",id);renderTrash();toast("Permanently deleted")})}
async function renderTrash(){currentView="trash";$("#search").placeholder="Search trash...";$("#crumbs").textContent="Trash";$("#content").innerHTML=`<div class="title">Trash</div><div class="sub">Deleted items are kept here until permanently removed.</div><div class="toolbar"><button class="btn danger" onclick="emptyTrash()">Empty Trash</button></div><div id="grid" class="grid"></div>`;let a=await all("trash"),g=$("#grid");g.innerHTML=a.length?a.map(x=>`<div class="card"><button class="more" onclick="event.stopPropagation();openMenu(event,'${x.id}',true)">⋯</button><div class="icon">${icon(x.name,x.type)}</div><div class="name">${esc(x.name)}</div><div class="meta">Deleted item</div></div>`).join(""):`<div class="empty">Trash is empty.</div>`}
async function emptyTrash(){let a=await all("trash");if(!a.length)return;confirmAction("Empty Trash","Every item in Trash will be permanently deleted. This cannot be undone.",async()=>{for(let x of a)await del("trash",x.id);renderTrash();toast("Trash emptied")})}
async function downloadItem(id){let x=await get("items",id);if(x.type==="folder"){await compressItems([id],true);return}let blob=new Blob([x.content||""],{type:"text/plain"});downloadBlob(blob,x.name)}
function downloadBlob(blob,name){let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
async function compressItems(ids,downloadAfter=false){
 if(!window.JSZip){toast("ZIP library is unavailable");return}
 let zip=new JSZip();async function add(id,path=""){let x=await get("items",id);if(!x)return;if(x.type==="folder"){let f=zip.folder(path+x.name);for(let c of await children(id))await add(c.id,path+x.name+"/")}else zip.file(path+x.name,x.content||"")}
 for(let id of ids)await add(id);let blob=await zip.generateAsync({type:"blob"});downloadBlob(blob,"archive.zip");toast("ZIP created")}
async function extractZip(id){let x=await get("items",id);if(!window.JSZip){toast("ZIP library is unavailable");return}let data=await (await fetch("data:text/plain;base64,"+btoa(unescape(encodeURIComponent(x.content||""))))).arrayBuffer();toast("ZIP extraction requires an imported binary ZIP file in this single-file build")}
function formatSize(n){if(!n)return "";let u=["B","KB","MB","GB"],i=0;while(n>1024&&i<3){n/=1024;i++}return n.toFixed(i?1:0)+" "+u[i]}

async function renderNotes(){
 currentView="notes";$("#search").placeholder="Search notes...";$("#crumbs").textContent="Notes";
 let notes=await all("notes");$("#content").innerHTML=`<div class="title">Notes</div><div class="sub">Write, save and organize your personal notes.</div><div class="toolbar"><button class="btn primary" onclick="newNote()">+ New Note</button></div><div class="noteLayout"><div class="notesList" id="notesList"></div><div class="noteEditor"><div class="field"><label>Name</label><input id="noteName" placeholder="Note name"></div><div class="field"><label>Description</label><input id="noteDesc" placeholder="Short description"></div><textarea id="noteContent" placeholder="Write your note..."></textarea><div class="modalactions"><button class="btn" onclick="downloadNote()">Download</button><button class="btn danger" onclick="deleteCurrentNote()">Delete</button><button class="btn primary" onclick="saveNote()">Save</button></div></div></div>`;drawNotes(notes);if(notes[0])loadNote(notes[0].id)
}
function drawNotes(notes){let q=$("#search").value.toLowerCase();$("#notesList").innerHTML=notes.filter(n=>n.name.toLowerCase().includes(q)).map(n=>`<div class="noteItem ${n.id===currentNote?"active":""}" onclick="loadNote('${n.id}')"><b>${esc(n.name)}</b><div class="meta">${esc(n.description||"")}</div></div>`).join("")||`<div class="empty" style="margin:10px">No notes yet.</div>`}
async function newNote(){let n={id:uid(),name:"Untitled Note",description:"",content:"",created:Date.now(),modified:Date.now()};await put("notes",n);currentNote=n.id;renderNotes()}
async function loadNote(id){let n=await get("notes",id);if(!n)return;currentNote=id;$("#noteName").value=n.name;$("#noteDesc").value=n.description||"";$("#noteContent").value=n.content||"";drawNotes(await all("notes"))}
async function saveNote(){if(!currentNote)return toast("Create a note first");let n=await get("notes",currentNote);n.name=$("#noteName").value.trim()||"Untitled Note";n.description=$("#noteDesc").value;n.content=$("#noteContent").value;n.modified=Date.now();await put("notes",n);drawNotes(await all("notes"));toast("Note saved")}
async function deleteCurrentNote(){if(!currentNote)return;let n=await get("notes",currentNote);confirmAction("Delete note",`Delete "${n.name}"?`,async()=>{await del("notes",currentNote);currentNote=null;renderNotes();toast("Note deleted")})}
async function downloadNote(){if(!currentNote)return;let n=await get("notes",currentNote);downloadBlob(new Blob([n.content||""],{type:"text/plain"}),n.name+".txt")}

document.querySelectorAll(".nav[data-view]").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));b.classList.add("active");b.dataset.view==="home"?renderHome():b.dataset.view==="notes"?renderNotes():renderTrash()});
$("#importBtn").onclick=()=>chooseImport(false);$("#search").oninput=()=>currentView==="home"?renderGrid():currentView==="trash"?renderTrash():renderNotes();
init();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</body>
</html>
